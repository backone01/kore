",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"문제가 생기면 해결책을 찾기 위해 어떻게 노력하실 건가요?\",\"question_vi\":\"Nếu phát sinh vấn đề bạn làm gì để tìm phương pháp giải quyết?\",\"answer_kr\":\"문제를 분석하고, 최선의 해결책을 찾기 위해 동료, 상사와 함께 협력한다.\",\"answer_vi\":\"Phân tích vấn đề, kết hợp với đồng nghiệp và cấp trên đưa ra giải pháp tối ưu nhất\"},{\"id\":\"169\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"다른 사람들과 잘 지내는 것이 왜 중요하다고 생각하세요?\",\"question_vi\":\"Bạn có nghĩ là việc hòa đồng với người khác quan trọng?\",\"answer_kr\":\"네, 업무 효율을 높이고, 긍정적인 근무 환경을 만들거든요\",\"answer_vi\":\"Vâng, theo tôi nó sẽ giúp làm tăng hiệu quả công việc, tạo môi trường làm việc tích cực\"},{\"id\":\"170\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"의사소통이 왜 중요한지 설명할 수 있나요?\",\"question_vi\":\"Bạn cho biết tại sao giao tiếp lại quan trọng?\",\"answer_kr\":\"서로 이해하고, 오해를 줄일 수 있습니다.\",\"answer_vi\":\"Giúp hiểu nhau và tránh hiểu lầm\"},{\"id\":\"180\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"의사소통을 방해하는 요소들은 무엇이 있나요?\",\"question_vi\":\"Nhúng yếu tố nào gây ảnh hưởng xấu đến giao tiếp?\",\"answer_kr\":\"오해, 감정적 상태 등이 방해 요소가 될 수 있다고 생각합니다.\",\"answer_vi\":\"Theo tôi sự hiểu lầm, tình trạng cảm xúc có thể là yếu tố gây ảnh hưởng\"},{\"id\":\"187\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"팀에서 효과적인 소통은 무엇입니까?\",\"question_vi\":\"Giao tiếp hiệu quả trong nhóm là gì?\",\"answer_kr\":\"잘 듣고, 필요한 말만 명확히 전달하는 것입니다.\",\"answer_vi\":\"Tôi lắng nghe và truyền đạt ngắn gọn, rõ ràng.\"},{\"id\":\"189\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"사람들 사이에서 지켜야 할 예절에 대해 잘 알고 있나요?\",\"question_vi\":\"Bạn có nắm rõ các phép tắc trong giao tiếp không?\",\"answer_kr\":\"네, 예의와 존중을 바탕으로 소통하고, 상대방을 배려하는 것이 중요하다.\",\"answer_vi\":\"Có, điều quan trọng trong giao tiếp là lịch sự, tôn trọng, quan tâm\"},{\"id\":\"192\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"일하면서 정해진 시간을 잘 지키시나요?\",\"question_vi\":\"Bạn có tuân thủ thời gian làm việc không?\",\"answer_kr\":\"네, 시간을 잘 지켜서 업무 효율을 높이고, 신뢰를 만듭니다.\",\"answer_vi\":\"Vâng, tôi luôn tuân thủ giờ làm việc để nâng cao hiệu quả công việc và tạo dựng lòng tin\"},{\"id\":\"171\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"두 가지 방법 중 선택할 때는 어떻게 합니까?\",\"question_vi\":\"Khi chọn giữa hai phương án, bạn làm sao?\",\"answer_kr\":\"각각의 장단점을 비교하고 가장 효율적인 방법을 선택합니다.\",\"answer_vi\":\"Tôi so sánh ưu nhược điểm để chọn cách hiệu quả nhất.\"},{\"id\":\"172\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"작업하다가 실수하면 어떻게 할거예요?\",\"question_vi\":\"Nếu bạn làm sai trong lúc làm việc thì sao?\",\"answer_kr\":\"상사(관리자)에게 보고하고 앞으로 다시 실수하지 않게 노력합니다.\",\"answer_vi\":\"Tôi báo cáo và cố gắng không lặp lại sai sót.\"},{\"id\":\"173\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"작업하다가 사고가 나면 어떻게 할거예요?\",\"question_vi\":\"Nếu xảy ra tai nạn khi làm việc thì sao?\",\"answer_kr\":\"큰 소리로 외치고 옆동료를 부르고 관리자에게 빨리 보고하겠습니다.\",\"answer_vi\":\"Tôi hô to, gọi đồng nghiệp và báo cáo quản lý.\"},{\"id\":\"174\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"불량품이 많이 나면 어떻게 할거예요?\",\"question_vi\":\"Nếu ra nhiều sản phẩm lỗi thì sao?\",\"answer_kr\":\"먼저 기계를 정지하고 (스위치를 끄고) 빨리 관리자에게 보고하겠습니다.\",\"answer_vi\":\"Tôi tắt máy và báo cáo ngay cho quản lý.\"},{\"id\":\"175\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"문제가 생겼을 때 누구에게 먼저 보고합니까?\",\"question_vi\":\"Nếu phát sinh vấn đề bạn báo cáo cho ai đầu tiên?\",\"answer_kr\":\"관리자에게 보고합니다.\",\"answer_vi\":\"Tôi sẽ báo ngay với quản lý.\"},{\"id\":\"176\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"작업 중 문제가 반복되면 어떻게 하시겠습니까?\",\"question_vi\":\"Trong công việc nếu vấn đề phát sinh lặp đi lặp lại thì bạn xử lý sao?\",\"answer_kr\":\"문제가 반복되면 관리자에게 보고합니다.\",\"answer_vi\":\"Tôi sẽ báo quản lý nếu vấn đề cứ lặp lại.\"},{\"id\":\"177\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"이 일에 필요한 기술이 있습니까?\",\"question_vi\":\"Bạn có kỹ năng cần thiết cho công việc này không?\",\"answer_kr\":\"기본적인 기계를 다룰 수 있고 작업 절차를 잘 이해하고 있습니다.\",\"answer_vi\":\"Tôi có thể vận hành máy móc cơ bản và hiểu quy trình làm việc.\"},{\"id\":\"178\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"기술을 어떻게 향상시키나요?\",\"question_vi\":\"Bạn làm thế nào để nâng cao kỹ năng?\",\"answer_kr\":\"책이나 영상으로 공부하고 선배에게 배웁니다.\",\"answer_vi\":\"Tôi học bằng sách, video và hỏi người đi trước.\"},{\"id\":\"179\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"새로운 기계를 만나면 어떻게 합니까?\",\"question_vi\":\"Khi gặp máy mới, bạn làm gì?\",\"answer_kr\":\"설명서를 꼼꼼히 읽고 안전하게 사용하는 방법을 익힙니다.\",\"answer_vi\":\"Tôi đọc kỹ hướng dẫn và học cách dùng an toàn.\"},{\"id\":\"181\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"기술적인 문제가 생기면 어떻게 합니까?\",\"question_vi\":\"Nếu có sự cố kỹ thuật thì bạn làm gì?\",\"answer_kr\":\"바로 작업을 멈추고 관리자에게 보고합니다.\",\"answer_vi\":\"Tôi sẽ dừng công việc và báo cáo khi gặp sự cố kỹ thuật.\"},{\"id\":\"182\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"한국에서 사용할 수 있는 기술이 있어요?\",\"question_vi\":\"Bạn có kỹ năng có thể dùng ở Hàn Quốc không?\",\"answer_kr\":\"저는 전자 제품 조립작업을 (4년) 동안 했는데 관련 일을 할 수 있습니다.\",\"answer_vi\":\"Tôi có kinh nghiệm trong các công việc liên quan.\"},{\"id\":\"183\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"다른 사람보다 잘 할수 있는 기술이 있어요?\",\"question_vi\":\"Bạn có kỹ năng nào làm tốt hơn người khác không?\",\"answer_kr\":\"저는 빠른 학습자이고 꼼꼼히 일합니다.\",\"answer_vi\":\"Tôi học nhanh và làm việc cẩn thận.\"},{\"id\":\"184\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"새로운 장비를 사용할 줄 모를 때는 어떻게 합니까?\",\"question_vi\":\"Khi chưa biết cách sử dụng trang thiết bị mới bạn làm gì?\",\"answer_kr\":\"설명서를 읽고 선배에게 배우며 안전하게 사용법을 익힙니다.\",\"answer_vi\":\"Tôi đọc hướng dẫn và học hỏi cách dùng an toàn.\"},{\"id\":\"185\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"작업 중 도구가(기계) 고장나면 어떻게 하시겠습니까?\",\"question_vi\":\"Đang làm nếu công cụ, máy móc bị hỏng thì bạn làm thế nào?\",\"answer_kr\":\"도구가(기계) 고장나면 바로 중단하고 관리자에게 보고하겠습니다.\",\"answer_vi\":\"Nếu công cụ, máy móc hỏng tôi sẽ dừng ngay và báo cáo quản lý.\"},{\"id\":\"186\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"업무를 잘 이해하지 못했을 때는 어떻게 합니까?\",\"question_vi\":\"Nếu bạn chưa hiểu rõ công việc thì bạn sẽ làm gì?\",\"answer_kr\":\"정확히 이해할 때까지 다시 묻습니다.\",\"answer_vi\":\"Tôi sẽ hỏi lại cho đến khi hiểu rõ.\"},{\"id\":\"188\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"상대가 내 말을 안 들으면 어떻게 합니까?\",\"question_vi\":\"Nếu đối phương không nghe bạn thì làm gì?\",\"answer_kr\":\"더 쉽게 설명하고 부드럽게 다시 말합니다.\",\"answer_vi\":\"Tôi giải thích lại một cách dễ hiểu và nhẹ nhàng.\"},{\"id\":\"190\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"논쟁이 있을 때는 어떻게 합니까?\",\"question_vi\":\"Khi có tranh luận, bạn làm gì?\",\"answer_kr\":\"감정을 자제하고 논리적으로 이야기합니다.\",\"answer_vi\":\"Tôi kiềm chế cảm xúc và nói chuyện hợp lý.\"},{\"id\":\"191\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"팀에서 오해가 생기면 어떻게 해결합니까?\",\"question_vi\":\"Nếu có hiểu lầm trong nhóm thì bạn làm gì?\",\"answer_kr\":\"오해가 생기면 먼저 이야기해서 풀려고 합니다.\",\"answer_vi\":\"Tôi sẽ trao đổi để giải quyết hiểu lầm.\"},{\"id\":\"193\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"다른 사람의 의견을 잘 듣는 편입니까?\",\"question_vi\":\"Bạn có phải tuýp người biết lắng nghe?\",\"answer_kr\":\"네, 다른 사람의 의견도 잘 듣는 편입니다.\",\"answer_vi\":\"Tôi là người biết lắng nghe ý kiến người khác.\"},{\"id\":\"194\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"상사에게 건의할 일이 있으면 어떻게 합니까?\",\"question_vi\":\"Nếu có kiến nghị thì bạn làm sao?\",\"answer_kr\":\"건의사항이 있으면 예의 있게 말씀드립니다.\",\"answer_vi\":\"Tôi sẽ trình bày đề xuất một cách lịch sự.\"},{\"id\":\"195\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"근무시간 중에 외출해야 할 경우에는 어떻게 합니까?\",\"question_vi\":\"Nếu bạn cần ra ngoài trong giờ làm thì làm gì?\",\"answer_kr\":\"상사에게 보고해서 허락을 받고 나가야 합니다.\",\"answer_vi\":\"Tôi sẽ báo cáo và xin phép trước khi ra ngoài.\"},{\"id\":\"196\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"회사가 월급을 안 주면 어떻게 합니까?\",\"question_vi\":\"Nếu công ty không trả lương thì bạn sẽ làm gì?\",\"answer_kr\":\"먼저 사무실에 올라가서 이유를 물어보고, 계속 성실히 일하면서 답변을 기다리겠습니다.\",\"answer_vi\":\"Tôi sẽ hỏi lý do, tiếp tục làm việc nghiêm túc và đợi câu trả lời.\"},{\"id\":\"197\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"모르는 일이 있으면 어떻게 합니까?\",\"question_vi\":\"Nếu có việc không biết thì bạn làm gì?\",\"answer_kr\":\"선배나 관리자에게 물어보고 배우겠습니다.\",\"answer_vi\":\"Tôi sẽ nhờ cấp trên hoặc người đi trước chỉ dạy.\"},{\"id\":\"198\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"직장에서 가장 중요한 것은 무엇이라고 생각합니까?\",\"question_vi\":\"Bạn nghĩ điều gì là quan trọng nhất ở nơi làm việc?\",\"answer_kr\":\"시간 약속, 정직함, 책임감이 가장 중요하다고 생각합니다.\",\"answer_vi\":\"Tôi cho rằng giữ đúng giờ, trung thực, và có trách nhiệm là quan trọng nhất.\"},{\"id\":\"199\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"누군가 규정을 어기면 어떻게 합니까?\",\"question_vi\":\"Nếu ai đó vi phạm quy định thì sao?\",\"answer_kr\":\"관리자에게 보고하겠습니다.\",\"answer_vi\":\"Tôi sẽ báo cáo nếu ai đó vi phạm nội quy.\"},{\"id\":\"200\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"피곤해도 일을 성실히 합니까?\",\"question_vi\":\"Bạn có làm việc chăm chỉ dù mệt không?\",\"answer_kr\":\"네, 피곤해도 끝까지 최선을 다하겠습니다.\",\"answer_vi\":\"Dù mệt tôi vẫn cố gắng làm việc hết mình.\"},{\"id\":\"201\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"실수하면 책임지시겠습니까?\",\"question_vi\":\"Nếu phạm sai lầm, bạn có chịu trách nhiệm không?\",\"answer_kr\":\"네, 잘못을 인정하고 바로잡겠습니다.\",\"answer_vi\":\"Tôi sẽ nhận lỗi và sửa chữa ngay.\"},{\"id\":\"202\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"회사에 일이 많으면 어떻게 할거예요?\",\"question_vi\":\"Nếu công ty nhiều việc bạn sẽ làm gì?\",\"answer_kr\":\"맡은 일은 빨리 끝내고 추가 업무도 열심히 하겠습니다.\",\"answer_vi\":\"Tôi sẽ làm xong nhanh rồi nhận thêm việc nếu có.\"},{\"id\":\"203\",\"id_img\":\"\",\"type\":\"ky-nang-nghe-nghiep\",\"timer\":\"6\",\"question_kr\":\"맡겼는 일이 끝나면 뭐 할거예요?\",\"question_vi\":\"Nếu xong việc của mình, bạn sẽ làm gì?\",\"answer_kr\":\"작업장을 정리하거나 다른 일을 도울 준비를 하겠습니다.\",\"answer_vi\":\"Tôi sẽ giúp dọn dẹp hoặc sẵn sàng làm việc khác.\"},{\"id\":\"204\",\"type\":\"giai-thich-cong-cu-nong\",\"timer\":\"\",\"id_img\":\"34\",\"question_kr\":\"이것은 뭐예요?\",\"question_vi\":\"Cái này là gì?\",\"answer_kr\":\"모종을 심는 데 사용하는 도구입니다.\",\"answer_vi\":\"Là dụng cụ sử dụng khi trồng cây.\"},{\"id\":\"205\",\"type\":\"giai-thich-cong-cu-nong\",\"timer\":\"\",\"id_img\":\"26\",\"question_kr\":\"이 도구는 무엇에 사용합니까?\",\"question_vi\":\"Dụng cụ này được dùng để làm gì?\",\"answer_kr\":\"고구마 캐는 데 사용하는 도구입니다.\",\"answer_vi\":\"Là dụng cụ dùng để đào khoai lang.\"},{\"id\":\"206\",\"type\":\"giai-thich-cong-cu-nong\",\"timer\":\"\",\"id_img\":\"4\",\"question_kr\":\"이건 언제 사용해요?\",\"question_vi\":\"Cái này dùng khi nào?\",\"answer_kr\":\"낙엽을 긁어모으는 데 사용하는 도구입니다.\",\"answer_vi\":\"Là dụng cụ dùng để cào lá rụng.\"},{\"id\":\"207\",\"type\":\"giai-thich-cong-cu-nong\",\"timer\":\"\",\"id_img\":\"16\",\"question_kr\":\"이건 뭐 하는 데 써요?\",\"question_vi\":\"Cái này dùng để làm gì?\",
