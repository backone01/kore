"question_vi\":\"Mũ bảo hộ là gì?\",\"answer_kr_hrd\":\"작업자가  물체와  부딪히거나  바닥으로  떨어졌을  때  머리를 보호하는  모자입니다.\",\"answer_kr\":\"안전모는 머리를 보호하는 보호구입니다.\",\"answer_vi_hrd\":\"Là loại mũ bảo vệ đầu của người lao động khi va chạm với vật thể hoặc rơi xuống sàn\",\"answer_vi\":\"Mũ bảo hộ là dụng cụ bảo vệ đầu.\"},{\"id\":\"266\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_1\",\"obj\":[\"보호구 착용\",\"Sử dụng dụng cụ bảo hộ\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"안전화는 무엇입니까?\",\"question_vi\":\"Giày bảo hộ là gì?\",\"answer_kr_hrd\":\"떨어지는 공구 또는 뾰족한 물건으로부터 발을 보호하기 위한 신발입니다.\",\"answer_kr\":\"안전화는 떨어지는 물건이나 날카로운 물건으로부터 발을 보호하는 신발입니다.\",\"answer_vi_hrd\":\"Là loại giày bảo vệ bàn chân khỏi các công cụ rơi hoặc vật sắc nhọn\",\"answer_vi\":\"Giày bảo hộ là giày bảo vệ chân khỏi vật rơi hoặc vật sắc nhọn.\"},{\"id\":\"267\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_1\",\"obj\":[\"보호구 착용\",\"Sử dụng dụng cụ bảo hộ\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"안전대는 무엇입니까?\",\"question_vi\":\"Dây an toàn là gì?\",\"answer_kr_hrd\":\"작업자가 높은 곳에서 바닥으로 떨어지는 것을 막는 장비입니다.\",\"answer_kr\":\"안전대는 높은 곳에서 떨어지는 것을 막는 보호구입니다.\",\"answer_vi_hrd\":\"Là thiết bị ngăn người lao động rơi từ nơi cao xuống sàn\",\"answer_vi\":\"Dây an toàn là dụng cụ giúp ngăn rơi ngã khi làm việc trên cao.\"},{\"id\":\"268\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_1\",\"obj\":[\"보호구 착용\",\"Sử dụng dụng cụ bảo hộ\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"보안면은 무엇입니까?\",\"question_vi\":\"Mặt nạ bảo hộ là gì?\",\"answer_kr_hrd\":\"불꽃이나  날아오는  물체로부터  얼굴과  눈을  보호하기 위한  장비입니다.\",\"answer_kr\":\"보안면은 얼굴과 눈을 보호하는 보호구입니다.\",\"answer_vi_hrd\":\"Là thiết bị bảo vệ mặt và mắt khỏi tia lửa hoặc vật thể bay.\",\"answer_vi\":\"Mặt nạ bảo hộ là dụng cụ bảo vệ mặt và mắt.\"},{\"id\":\"269\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_1\",\"obj\":[\"보호구 착용\",\"Sử dụng dụng cụ bảo hộ\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"귀마개는 무엇입니까?\",\"question_vi\":\"Nút tai là gì?\",\"answer_kr_hrd\":\"시끄럽고  큰  소리가  나는  장소에서  귀를  보호하기  위한 용품입니다.\",\"answer_kr\":\"귀마개는 큰 소음으로부터 귀를 보호하는 보호구입니다.\",\"answer_vi_hrd\":\"Là vật dụng để bảo vệ tai ở những nơi có tiếng ồn và âm thanh lớn.\",\"answer_vi\":\"Nút tai là dụng cụ bảo vệ tai khỏi tiếng ồn lớn.\"},{\"id\":\"270\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_1\",\"obj\":[\"보호구 착용\",\"Sử dụng dụng cụ bảo hộ\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"방진마스크는 무엇입니까?\",\"question_vi\":\"Khẩu trang chống bụi là gì?\",\"answer_kr_hrd\":\"공기  중에  있는  먼지로부터  입과  코를  보호하기  위한 용품입니다.\",\"answer_kr\":\"방진마스크는 먼지로부터 입과 코를 보호하는 마스크입니다.\",\"answer_vi_hrd\":\"Là vật dụng để bảo vệ miệng và mũi khỏi bụi trong không khí.\",\"answer_vi\":\"Khẩu trang chống bụi là khẩu trang bảo vệ miệng và mũi khỏi bụi.\"},{\"id\":\"271\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_1\",\"obj\":[\"보호구 착용\",\"Sử dụng dụng cụ bảo hộ\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"방독마스크는 무엇입니까?\",\"question_vi\":\"Khẩu trang chống độc là gì?\",\"answer_kr_hrd\":\"공기 중에 있는 화학물질 등으로부터 입과 코를 보호하기 위한 용품입니다.\",\"answer_kr\":\"방독마스크는 유해 화학물질로부터 입과 코를 보호하는 마스크입니다.\",\"answer_vi_hrd\":\"Là vật dụng để bảo vệ miệng và mũi khỏi các chất hóa học trong không khí.\",\"answer_vi\":\"Khẩu trang chống độc là khẩu trang bảo vệ miệng và mũi khỏi hóa chất độc hại.\"},{\"id\":\"272\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_1\",\"obj\":[\"보호구 착용\",\"Sử dụng dụng cụ bảo hộ\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"방열복은 무엇입니까?\",\"question_vi\":\"Quần áo chống nhiệt là gì?\",\"answer_kr_hrd\":\"매우  뜨거운  장소에서  열과  불로부터  몸을  보호하기  위한 작업복입니다.\",\"answer_kr\":\"방열복은 높은 열과 불로부터 몸을 보호하는 작업복입니다.\",\"answer_vi_hrd\":\"Là quần áo bảo hộ để bảo vệ cơ thể khỏi nhiệt và lửa ở những nơi rất nóng.\",\"answer_vi\":\"Quần áo chống nhiệt là đồ bảo hộ bảo vệ cơ thể khỏi nhiệt cao và lửa.\"},{\"id\":\"273\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_1\",\"obj\":[\"보호구 착용\",\"Sử dụng dụng cụ bảo hộ\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"방한복은 무엇입니까?\",\"question_vi\":\"Quần áo chống lạnh là gì?\",\"answer_kr_hrd\":\"매우  추운  장소에서  몸  온도를  유지하기  위한  보온용 작업복입니다.\",\"answer_kr\":\"방한복은 추운 곳에서 몸을 따뜻하게 보호하는 작업복입니다.\",\"answer_vi_hrd\":\"Là quần áo bảo hộ giữ nhiệt dùng để duy trì thân nhiệt ở những nơi rất lạnh.\",\"answer_vi\":\"Quần áo chống lạnh là đồ bảo hộ giữ ấm cơ thể khi làm việc nơi lạnh.\"},{\"id\":\"274\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_1\",\"obj\":[\"보호구 착용\",\"Sử dụng dụng cụ bảo hộ\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"보호구를 왜 착용하여야 할까요?\",\"question_vi\":\"Tại sao chúng ta phải đeo dụng cụ bảo hộ?\",\"answer_kr_hrd\":\"작업자의  생명과  건강을  지키기  위한  가장  기본적이고  필수적인 조치이기  때문입니다.\",\"answer_kr\":\"보호구는 생명과 건강을 지키기 위해 반드시 착용해야 합니다.\",\"answer_vi_hrd\":\"Bởi vì đây là biện pháp cơ bản và cần thiết nhất để bảo vệ tính mạng và sức khỏe của người lao động.\",\"answer_vi\":\"Cần đeo dụng cụ bảo hộ để bảo vệ tính mạng và sức khỏe.\"},{\"id\":\"275\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_1\",\"obj\":[\"보호구 착용\",\"Sử dụng dụng cụ bảo hộ\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"머리를 보호하기 위해 착용하는 보호구는 무엇인가요?\",\"question_vi\":\"Dụng cụ bảo hộ để bảo vệ đầu là gì?\",\"answer_kr_hrd\":\"머리를 보호하기 위해서는 안전모를 착용해야 합니다. 안전모 착용 시에는 턱끈을  조여야  합니다.\",\"answer_kr\":\"머리를 보호하는 보호구는 안전모입니다.\",\"answer_vi_hrd\":\"Để bảo vệ đầu, cần sử dụng mũ bảo hộ. Khi đội mũ bảo hộ, cần thắt chặt dây cằm.\",\"answer_vi\":\"Dụng cụ bảo vệ đầu là mũ bảo hộ.\"},{\"id\":\"276\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_1\",\"obj\":[\"보호구 착용\",\"Sử dụng dụng cụ bảo hộ\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"높은 장소에서 작업 시 안전모 외에 착용해야 하는 보호구는 무엇인가요?\",\"question_vi\":\"Dụng cụ bảo hộ nào cần phải đeo khi làm việc ở nơi cao ngoài mũ bảo hộ?\",\"answer_kr_hrd\":\"높은 장소에서 작업하는 경우에는 안전대를 착용하고, 안전대 부착설비에 고리를  체결해야  합니다.\",\"answer_kr\":\"높은 곳에서는 안전모와 함께 안전대를 착용해야 합니다.\",\"answer_vi_hrd\":\"Khi làm việc trên cao, phải đeo dây an toàn và móc khóa vào thiết bị giữ dây an toàn.\",\"answer_vi\":\"Khi làm việc trên cao cần đội mũ bảo hộ và đeo dây an toàn.\"},{\"id\":\"277\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_1\",\"obj\":[\"보호구 착용\",\"Sử dụng dụng cụ bảo hộ\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"화학물질로부터 입과 코를 보호하기 위해 착용하는 보호구는 무엇인가요?\",\"question_vi\":\"Dụng cụ bảo hộ nào được đeo để bảo vệ miệng và mũi khỏi các chất hóa học?\",\"answer_kr\":\"화학물질로부터 입과 코를 보호하는 보호구는 방독마스크입니다.\",\"answer_vi\":\"Dụng cụ bảo vệ miệng và mũi khỏi hóa chất là khẩu trang chống độc.\"},{\"id\":\"278\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_1\",\"obj\":[\"보호구 착용\",\"Sử dụng dụng cụ bảo hộ\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"소음이 심한 작업 환경에서 귀를 보호하기 위해 착용하는 보호구는 무엇인가요?\",\"question_vi\":\"Dụng cụ bảo hộ nào được đeo để bảo vệ tai khỏi tiếng ồn trong môi trường làm việc có tiếng ồn lớn?\",\"answer_kr\":\"소음이 심한 곳에서 귀를 보호하는 보호구는 귀마개입니다.\",\"answer_vi\":\"Dụng cụ bảo vệ tai ở nơi ồn là nút tai.\"},{\"id\":\"279\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_2\",\"obj\":[\"비상구 등 대피로 확인\",\"Xác định lối thoát hiểm\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"비상구가  무엇인가요?\",\"question_vi\":\"Cửa thoát hiểm là gì?\",\"answer_kr_hrd\":\"화재, 지진 등 갑작스러운 사고가 일어났을 때 신속하게 대피할 수 있도록 마련된  출입구입니다.\",\"answer_kr\":\"비상구는 사고가 났을 때 빨리 대피하는 출입구입니다.\",\"answer_vi_hrd\":\"Cửa thoát hiểm là lối ra được chuẩn bị để sơ tán nhanh chóng khi xảy ra các sự cố bất ngờ như hỏa hoạn, động đất.\",\"answer_vi\":\"Cửa thoát hiểm là lối ra để sơ tán nhanh khi có sự cố.\"},{\"id\":\"281\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_2\",\"obj\":[\"비상구 등 대피로 확인\",\"Xác định lối thoát hiểm\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"대피로는 무엇인가요?\",\"question_vi\":\"Lối thoát hiểm là gì?\",\"answer_kr_hrd\":\"화재  등  위급  상황이  발생했을  때  작업자가  신속하고  안전하게  빠져 나갈  수  있도록  사전에  확보된  이동  경로입니다.\",\"answer_kr\":\"대피로는 위급할 때 안전하게 나가는 길입니다.\",\"answer_vi_hrd\":\"Là lối đi được xác định trước để người lao động có thể thoát ra nhanh chóng và an toàn khi xảy ra tình huống khẩn cấp như hỏa hoạn.\",\"answer_vi\":\"Lối thoát hiểm là đường đi an toàn khi có tình huống khẩn cấp.\"},{\"id\":\"283\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_2\",\"obj\":[\"비상구 등 대피로 확인\",\"Xác định lối thoát hiểm\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"비상구  등  대피로는  왜  확인해야  할까요?\",\"question_vi\":\"Tại sao cần phải kiểm tra lối thoát hiểm?\",\"answer_kr_hrd\":\"사고가  발생하였을  때  생명을  지키기  위한  가장  기본적인  재난 대응  수칙으로  신속한  이동이  가능하기  때문입니다.\",\"answer_kr\":\"비상구와 대피로를 알아야 사고 때 빨리 대피할 수 있기 때문입니다.\",\"answer_vi_hrd\":\"Vì đây là quy tắc ứng phó thảm họa cơ bản nhất để bảo vệ tính mạng, giúp mọi người có thể di chuyển nhanh chóng khi xảy ra sự cố.\",\"answer_vi\":\"Cần biết cửa và lối thoát hiểm để sơ tán nhanh khi có sự cố.\"},{\"id\":\"282\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_2\",\"obj\":[\"비상구 등 대피로 확인\",\"Xác định lối thoát hiểm\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"소화기란  무엇이며  소화기의  색상은  어떻게  되나요?\",\"question_vi\":\"Bình chữa cháy là gì và màu sắc của bình chữa cháy như thế nào?\",\"answer_kr_hrd\":\"소화기란 불을 끄기 위한 도구로 보통은 붉은색 입니다. 평소에 소화기의 위치를  확인해  두는  것이  중요합니다.\",\"answer_kr\":\"소화기는 불을 끄는 장비이며 보통 빨간색입니다.\",\"answer_vi_hrd\":\"Bình chữa cháy là dụng cụ dùng để dập lửa và thường có màu đỏ. Điều quan trọng là phải biết trước vị trí đặt bình chữa cháy.\",\"answer_vi\":\"Bình chữa cháy là thiết bị dập lửa và thường có màu đỏ.\"},{\"id\":\"284\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_3\",\"obj\":[\"안전보건표지 확인\",\"Xác định biển báo an toàn\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"안전보건표지는 무엇인가요?\",\"question_vi\":\"Biển báo an toàn là gì?\",\"answer_kr_hrd\":\"작업장 내 위험요인을 알리고, 안전한 행동을 유도하기 위해 사용하는 시각적  표지입니다.\",\"answer_kr\":\"안전보건표지는 위험을 알리고 안전 행동을 안내하는 표지입니다.\",\"answer_vi_hrd\":\"Là biển báo trực quan được sử dụng để thông báo về các yếu tố nguy hiểm tại nơi làm việc và hướng dẫn hành vi an toàn.\",\"answer_vi\":\"Biển an toàn vệ sinh lao động là biển báo nguy hiểm và hướng dẫn hành động an toàn.\"},{\"id\":\"285\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_3\",\"obj\":[\"안전보건표지 확인\",\"Xác định biển báo an toàn\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"안전보건표지에는 어떤 종류가 있을까요?\",\"question_vi\":\"Có những loại biển báo an toàn nào?\",\"answer_kr_hrd\":\"위험행동을  막기  위한  금지표지,  위험에  대한  주의  위한  경고표지, 안전행동 유도를 위한 지시표시, 대피경로 등을 알려주기 위한 안내표지가 있습니다.\",\"answer_kr\":\"안전보건표지에는 경고, 금지, 지시, 안내 표지가 있습니다.\",\"answer_vi_hrd\":\"Có biển cấm để ngăn chặn hành vi nguy hiểm, biển cảnh báo để cảnh báo nguy hiểm, biển hiệu lệnh để hướng dẫn hành vi an toàn và biển chỉ dẫn để thông báo về lối sơ tán, v.v.\",\"answer_vi\":\"Biển an toàn gồm biển cảnh báo, biển cấm, biển chỉ dẫn và biển hướng dẫn.\"},{\"id\":\"286\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_3\",\"obj\":[\"안전보건표지 확인\",\"Xác định biển báo an toàn\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"안전보건표지를 왜 확인해야 할까요?\",\"question_vi\":\"Tại sao cần phải kiểm tra biển báo an toàn?\",\"answer_kr_hrd\":\"표지를  통하여  눈에  보이지  않는  위험을  시각적으로  가장  빠르고 명확하게  파악할  수  있기  때문입니다.\",\"answer_kr\":\"안전보건표지를 확인하면 위험을 빠르게 알 수 있기 때문입니다.\",\"answer_vi_hrd\":\"Vì thông qua biển báo, có thể nhận biết bằng mắt những nguy hiểm khó nhìn thấy một cách nhanh chóng và rõ ràng nhất.\",\"answer_vi\":\"Cần xem biển an toàn để nhận biết nguy hiểm nhanh chóng.\"},{\"id\":\"287\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_3\",\"obj\":[\"안전보건표지 확인\",\"Xác định biển báo an toàn\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"위험장소 출입금지 등 금지표지는 무슨 색인가요?\",\"question_vi\":\"Biển cấm như cấm vào khu vực nguy hiểm có màu gì?\",\"answer_kr_hrd\":\"출입  금지  등  위험  행동을  막기  위한  금지표지는  붉은색  원  모양에 붉은색으로  사선이  그려져  있습니다.\",\"answer_kr\":\"금지표지는 빨간색 원과 사선으로 표시합니다.\",\"answer_vi_hrd\":\"Biển cấm dùng để ngăn chặn các hành vi nguy hiểm như cấm vào có dạng vòng tròn màu đỏ với một đường chéo màu đỏ.\",\"answer_vi\":\"Biển cấm được ký hiệu bằng vòng tròn đỏ và đường chéo đỏ.\"},{\"id\":\"288\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_4\",\"obj\":[\"방호장치 정상 작동 여부 확인\",\"Kiểm tra xem thiết bị bảo vệ có hoạt động bình thường không\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"방호장치가 무엇인가요?\",\"question_vi\":\"Thiết bị bảo vệ là gì?\",\"answer_kr_hrd\":\"기계 등에서 발생하는 위험 요인으로부터 작업자의 신체를 보호하거나 위험을  차단하는  설비입니다.\",\"answer_kr\":\"방호장치는 기계의 위험으로부터 작업자를 보호하는 장치입니다.\",\"answer_vi_hrd\":\"Là thiết bị bảo vệ cơ thể người lao động khỏi các yếu tố nguy hiểm phát sinh từ máy móc hoặc ngăn chặn nguy hiểm.\",\"answer_vi\":\"Thiết bị bảo vệ là thiết bị bảo vệ người lao động khỏi nguy hiểm từ máy móc.\"},{\"id\":\"289\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_4\",\"obj\":[\"방호장치 정상 작동 여부 확인\",\"Kiểm tra xem thiết bị bảo vệ có hoạt động bình thường không\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"정상 작동이 무슨 뜻인가요?\",\"question_vi\":\"Hoạt động bình thường có nghĩa là gì?\",\"answer_kr_hrd\":\"장치, 설비 등이 정해진 목적과 기준에 맞게 안전하고 정확하게 작동하는 상태입니다.\",\"answer_kr\":\"정상 작동은 장치가 안전하고 정확하게 작동하는 상태입니다.\",\"answer_vi_hrd\":\"Là trạng thái trong đó thiết bị, máy móc vận hành an toàn và chính xác theo đúng mục đích và tiêu chuẩn đã định.\",\"answer_vi\":\"Hoạt động bình thường là trạng thái thiết bị chạy an toàn và chính xác.\"},{\"id\":\"290\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_4\",\"obj\":[\"방호장치 정상 작동 여부 확인\",\"Kiểm tra xem thiết bị bảo vệ có hoạt động bình thường không\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"방호장치 정상 작동 여부를 왜 확인하여야 하나요?\",\"question_vi\":\"Tại sao cần phải kiểm tra xem thiết bị bảo vệ có hoạt động bình thường không?\",\"answer_kr_hrd\":\"사람이  실수를  하더라도  방호장치가  정상적으로  작동해야만  실질적인 보호  효과가  있기  때문입니다.\",\"answer_kr\":\"방호장치가 정상 작동해야 사고를 막을 수 있기 때문입니다.\",\"answer_vi_hrd\":\"Vì ngay cả khi con người mắc lỗi, thiết bị bảo vệ phải hoạt động bình thường thì mới thực sự phát huy tác dụng bảo vệ.\",\"answer_vi\":\"Cần kiểm tra vì thiết bị bảo vệ phải hoạt động tốt mới ngăn được tai nạn.\"},{\"id\":\"291\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_4\",\"obj\":[\"방호장치 정상 작동 여부 확인\",\"Kiểm tra xem thiết bị bảo vệ có hoạt động bình thường không\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"작업 전 안전점검이 무엇인가요?\",\"question_vi\":\"Kiểm tra an toàn trước khi làm việc là gì?\",\"answer_kr_hrd\":\"기계에서 이상한 소리가 나거나  흔들리거나  하면  사용하지  말고  반장님  등  관리자에게  보고해야 합니다.\",\"answer_kr\":\"작업 전 안전점검은 작업 전에 기계와 설비의 이상 여부를 확인하는 것입니다.\",\"answer_vi_hrd\":\"Nếu máy phát ra tiếng động lạ hoặc rung lắc thì không được sử dụng mà phải báo cáo cho người quản lý như tổ trưởng.\",\"answer_vi\":\"Kiểm tra an toàn trước khi làm việc là kiểm tra máy móc, thiết bị có bất thường không.\"},{\"id\":\"292\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_5\",\"obj\":[\"화학물질  MSDS(물질안전보건자료)  확인\",\"Kiểm tra MSDS - dữ liệu an toàn và sức khỏe hóa chất\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"화학물질이  무엇인가요?\",\"question_vi\":\"Hóa chất là gì?\",\"answer_kr_hrd\":\"사업장에서  제품을  만드는  데  사용하는  고체,  액체,  기체로  사람에게 유해하거나  폭발  등의  위험성을  가진  물질입니다.\",\"answer_kr\":\"화학물질은 사람에게 해롭거나 폭발 위험이 있는 고체, 액체, 기체입니다.\",\"answer_vi_hrd\":\"Là các chất rắn, lỏng hoặc khí được sử dụng để sản xuất sản phẩm tại nơi làm việc, có hại cho con người hoặc tiềm ẩn nguy cơ như cháy nổ.\",\"answer_vi\":\"Hóa chất là chất rắn, lỏng hoặc khí có thể gây hại hoặc có nguy cơ cháy nổ.\"},{\"id\":\"293\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_5\",\"obj\":[\"화학물질  MSDS(물질안전보건자료)  확인\",\"Kiểm tra MSDS - dữ liệu an toàn và sức khỏe hóa chất\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"MSDS(물질안전보건자료)가  무엇인가요?\",\"question_vi\":\"MSDS (dữ liệu an toàn và sức khỏe hóa chất) là gì?\",\"answer_kr_hrd\":\"화학물질에  대한  정보(이름,  성분,  유해성,  위험성,  보관방법,  다룰  때 주의할  점,  필요한  보호구,  응급조치  등)가  담긴  설명서입니다.\",\"answer_kr\":\"MSDS는 화학물질의 위험성과 취급 방법을 알려 주는 자료입니다.\",\"answer_vi_hrd\":\"Là tài liệu hướng dẫn chứa thông tin về hóa chất như tên, thành phần, tác hại, mức độ nguy hiểm, cách bảo quản, những điều cần chú ý khi sử dụng, dụng cụ bảo hộ cần thiết và biện pháp sơ cứu, v.v.\",\"answer_vi\":\"MSDS là tài liệu cho biết nguy hiểm và cách xử lý hóa chất.\"},{\"id\":\"294\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_5\",\"obj\":[\"화학물질  MSDS(물질안전보건자료)  확인\",\"Kiểm tra MSDS - dữ liệu an toàn và sức khỏe hóa chất\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"화학물질을 취급할 때 어떤 보호구가 필요한가요?\",\"question_vi\":\"Khi xử lý hóa chất, cần sử dụng thiết bị bảo hộ nào?\",\"answer_kr\":\"화학물질을 취급할 때는 장갑, 보호안경, 보호복 등을 착용해야 합니다.\",\"answer_vi\":\"Khi xử lý hóa chất cần đeo găng tay, kính bảo hộ và mặc đồ bảo hộ.\"},{\"id\":\"295\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_5\",\"obj\":[\"화학물질  MSDS(물질안전보건자료)  확인\",\"Kiểm tra MSDS - dữ liệu an toàn và sức khỏe hóa chất\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"화학물질 MSDS(물질안전보건자료)를 왜 확인해야  할까요?\",\"question_vi\":\"Tại sao cần phải kiểm tra MSDS - dữ liệu an toàn và sức khỏe hóa chất?\",\"answer_kr_hrd\":\"화학물질을  안전하게  취급하고  사고를  예방하기  위해  반드시 확인해야  하는  가장  기본적인  안전정보이기  때문입니다.\",\"answer_kr\":\"MSDS를 확인해야 화학물질을 안전하게 취급할 수 있기 때문입니다.\",\"answer_vi_hrd\":\"Vì đây là thông tin an toàn cơ bản nhất bắt buộc phải kiểm tra để sử dụng hóa chất an toàn và phòng ngừa tai nạn.\",\"answer_vi\":\"Cần xem MSDS để sử dụng hóa chất an toàn.\"},{\"id\":\"296\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_5\",\"obj\":[\"화학물질  MSDS(물질안전보건자료)  확인\",\"Kiểm tra MSDS - dữ liệu an toàn và sức khỏe hóa chất\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"화학물질을 사용하는 작업 전에는 어떤 보호구를 준비해야 하나요?\",\"question_vi\":\"Trước khi sử dụng hóa chất, cần chuẩn bị thiết bị bảo hộ nào?\",\"answer_kr_hrd\":\"화학물질을 사용하는 작업 전에서 방독마스크, 화학물질용 보호장갑 등을 준비하고  작업  시  착용합니다.\",\"answer_kr\":\"작업 전에는 방독마스크와 화학물질용 보호장갑을 준비해야 합니다.\",\"answer_vi_hrd\":\"Trước khi làm công việc có sử dụng hóa chất, cần chuẩn bị mặt nạ phòng độc, găng tay bảo hộ chống hóa chất, v.v. và đeo chúng khi làm việc.\",\"answer_vi\":\"Trước khi làm việc cần chuẩn bị khẩu trang chống độc và găng tay chống hóa chất.\"},{\"id\":\"297\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_6\",\"obj\":[\"밀폐공간 작업 전 환기\",\"Thông gió trước khi làm việc trong không gian kín\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"밀폐공간이  무엇인가요?\",\"question_vi\":\"Không gian kín là gì?\",\"answer_kr_hrd\":\"통풍이 불충분하여 산소결핍, 유해가스, 증기 또는 분진이 존재하거나 발생할  우려가  있는  공간입니다.\",\"answer_kr\":\"밀폐공간은 환기가 잘 안 되어 산소 부족이나 유해가스 위험이 있는 공간입니다.\",\"answer_vi_hrd\":\"Là không gian thông gió không đầy đủ, có thể tồn tại hoặc phát sinh tình trạng thiếu oxy, khí độc, hơi nước hoặc bụi.\",\"answer_vi\":\"Không gian kín là nơi thông gió kém, có nguy cơ thiếu oxy hoặc khí độc.\"},{\"id\":\"298\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_6\",\"obj\":[\"밀폐공간 작업 전 환기\",\"Thông gió trước khi làm việc trong không gian kín\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"환기가 무슨 뜻인가요?\",\"question_vi\":\"Thông gió có nghĩa là gì?\",\"answer_kr_hrd\":\"실내의 오염된 공기를 외부의 깨끗한 공기와 교체하여 쾌적하고 안전한 작업환경을  유지하는  행위입니다.\",\"answer_kr\":\"환기는 오염된 공기를 깨끗한 공기로 바꾸는 것입니다.\",\"answer_vi_hrd\":\"Là việc thay không khí ô nhiễm trong nhà bằng không khí sạch từ bên ngoài để duy trì môi trường làm việc thoải mái và an toàn.\",\"answer_vi\":\"Thông gió là thay không khí bẩn bằng không khí sạch.\"},{\"id\":\"299\",\"type\":\"an-toan-suc-khoe-1\",\"group\":\"atsk_1_6\",\"obj\":[\"밀폐공간 작업 전 환기\",\"Thông gió trước khi làm việc trong không gian kín\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"밀폐공간 작업 전 왜 환기를 해야 할까요?\",\"question_vi\":\"Tại sao cần phải thông gió trước khi làm việc trong không gian kín?\",\"answer_kr_hrd\":\"환기하지  않고  작업을  하면,  유해가스나  산소가  부족하여  작업자가 사망할  위험이  있기  때문입니다.\",\"answer_kr\":\"환기하지 않으면 산소 부족이나 유해가스로 사망할 수 있기 때문입니다.\",\"answer_vi_hrd\":\"Vì nếu làm việc mà không thông gió, người lao động có thể tử vong do khí độc hoặc thiếu oxy.\",\"answer_vi\":\"Cần thông gió vì thiếu oxy hoặc khí độc có thể gây tử vong.\"},{\"id\":\"300\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_1\",\"obj\":[\"가동 중인 기계 정비 금지\",\"Cấm bảo trì máy móc đang hoạt động\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"가동이  무슨  뜻인가요?\",\"question_vi\":\"Vận hành có nghĩa là gì?\",\"answer_kr_hrd\":\"생산활동을  위하여  기계,  설비  등을  작동시켜  실제로  운전하거나 운영하는  것입니다.\",\"answer_kr\":\"가동은 기계나 설비를 실제로 작동시키는 것입니다.\",\"answer_vi_hrd\":\"Là việc vận hành thực tế các thiết bị máy móc để phục vụ hoạt động sản xuất.\",\"answer_vi\":\"Vận hành là cho máy móc hoặc thiết bị hoạt động.\"},{\"id\":\"301\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_1\",\"obj\":[\"가동 중인 기계 정비 금지\",\"Cấm bảo trì máy móc đang hoạt động\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"정비가 무슨 뜻인가요?\",\"question_vi\":\"Bảo trì có nghĩa là gì?\",\"answer_kr_hrd\":\"기계, 설비 등의 이상 여부를 확인하고 고장이나 사고를 예방하기 위해 수리하거나  부품을  교체하는  작업입니다.\",\"answer_kr\":\"정비는 기계를 점검하고 수리하거나 부품을 교체하는 작업입니다.\",\"answer_vi_hrd\":\"Là công việc kiểm tra tình trạng bất thường của máy móc, thiết bị, v.v. và sửa chữa hoặc thay thế linh kiện để phòng ngừa hỏng hóc, tai nạn.\",\"answer_vi\":\"Bảo trì là kiểm tra, sửa chữa máy hoặc thay linh kiện.\"},{\"id\":\"302\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_1\",\"obj\":[\"가동 중인 기계 정비 금지\",\"Cấm bảo trì máy móc đang hoạt động\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"가동 중인 기계를 왜 정비하면 안 될까요?\",\"question_vi\":\"Tại sao không được bảo trì máy móc đang hoạt động?\",\"answer_kr_hrd\":\"정비를  위해  기계  내부에  손이나  머리를  넣게  되는  경우가 많은데  기계가  갑자기  작동하면  사고가  발생할  수  있기 때문입니다.\",\"answer_kr\":\"가동 중인 기계를 정비하면 갑자기 움직여 사고가 날 수 있기 때문입니다.\",\"answer_vi_hrd\":\"Vì để bảo trì thường phải đưa tay hoặc đầu vào bên trong máy, nếu máy đột ngột hoạt động thì có thể xảy ra tai nạn.\",\"answer_vi\":\"Không được bảo trì máy đang chạy vì máy có thể bất ngờ chuyển động gây tai nạn.\"},{\"id\":\"303\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_1\",\"obj\":[\"가동 중인 기계 정비 금지\",\"Cấm bảo trì máy móc đang hoạt động\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"기계가 알 수 없는 이유로 멈추면 어떻게 해야 하나요?\",\"question_vi\":\"Nếu máy móc dừng lại vì lý do không rõ, bạn nên làm gì?\",\"answer_kr_hrd\":\"기계가  알  수  없는  이유로  멈추면  함부로  조작하지  말고  반장님  등 관리자에게  보고합니다.\",\"answer_kr\":\"함부로 조작하지 말고 관리자에게 보고해야 합니다.\",\"answer_vi_hrd\":\"Nếu máy dừng lại không rõ nguyên nhân, không được tự ý thao tác mà phải báo cáo cho người quản lý như tổ trưởng.\",\"answer_vi\":\"Không tự ý thao tác, cần báo cho quản lý.\"},{\"id\":\"304\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_2\",\"obj\":[\"모르는 기계 임의 조작 금지\",\"Cấm thao tác tùy tiện với máy móc lạ\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"모르는 기계가 무슨 뜻인가요?\",\"question_vi\":\"Máy móc lạ có nghĩa là gì?\",\"answer_kr_hrd\":\"사용법, 조작 절차 등에 대하여 정확하게 알지 못하여 올바르게 작동시킬 수  없는  설비입니다.\",\"answer_kr\":\"모르는 기계는 사용법을 정확히 모르는 설비입니다.\",\"answer_vi_hrd\":\"Là thiết bị mà người lao động không thể vận hành đúng cách do không biết chính xác cách sử dụng, quy trình thao tác, v.v.\",\"answer_vi\":\"Máy không biết là thiết bị mình chưa nắm rõ cách sử dụng.\"},{\"id\":\"305\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_2\",\"obj\":[\"모르는 기계 임의 조작 금지\",\"Cấm thao tác tùy tiện với máy móc lạ\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"임의 조작이 무슨 뜻인가요?\",\"question_vi\":\"Thao tác tùy tiện có nghĩa là gì?\",\"answer_kr_hrd\":\"지정된 절차나 허가 없이 기계나 설비를 마음대로 조작하거나 변경하는 행위입니다.\",\"answer_kr\":\"임의 조작은 허가 없이 기계나 설비를 마음대로 조작하는 것입니다.\",\"answer_vi_hrd\":\"Là hành vi tự ý vận hành hoặc thay đổi máy móc, thiết bị mà không tuân theo quy trình đã định hoặc không được phép.\",\"answer_vi\":\"Thao tác tùy tiện là tự ý điều khiển máy móc khi chưa được phép.\"},{\"id\":\"306\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_2\",\"obj\":[\"모르는 기계 임의 조작 금지\",\"Cấm thao tác tùy tiện với máy móc lạ\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"모르는 기계를 왜 임의로 조작하면 안 될까요?\",\"question_vi\":\"Tại sao không được thao tác tùy tiện với máy móc lạ?\",\"answer_kr_hrd\":\"기계가  갑자기  작동하거나  예상하지  못한  동작이  발생하면 작업자와  동료에게  사고가  발생할  수  있기  때문입니다.\",\"answer_kr\":\"모르는 기계를 임의로 조작하면 예상 못한 사고가 날 수 있기 때문입니다.\",\"answer_vi_hrd\":\"Vì nếu máy đột ngột hoạt động hoặc thực hiện chuyển động không lường trước thì người lao động và đồng nghiệp có thể gặp tai nạn.\",\"answer_vi\":\"Không tự ý dùng máy không biết vì có thể gây tai nạn bất ngờ.\"},{\"id\":\"307\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_2\",\"obj\":[\"모르는 기계 임의 조작 금지\",\"Cấm thao tác tùy tiện với máy móc lạ\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"비상정지장치가 무엇인지 아나요?\",\"question_vi\":\"Bạn có biết thiết bị dừng khẩn cấp là gì không?\",\"answer_kr_hrd\":\"위험한  상황이  발생하거나  기계를  긴급하게  멈춰야  할  경우  정지시키는 버튼을  비상정지장치라고  합니다.\",\"answer_kr\":\"비상정지장치는 위험할 때 기계를 즉시 멈추는 버튼입니다.\",\"answer_vi_hrd\":\"Người ta gọi nút dừng trong trường hợp phát sinh tình hình nguy hiểm hoặc phải dừng máy gấp là nút 'dừng khẩn cấp'\",\"answer_vi\":\"Thiết bị dừng khẩn cấp là nút dùng để dừng máy ngay khi nguy hiểm.\"},{\"id\":\"308\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_3\",\"obj\":[\"안전장치·시설 해체·해지 금지\",\"Cấm tháo dỡ hoặc vô hiệu hóa thiết bị và cơ sở an toàn\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"안전장치·시설이 무엇인지 알고 있나요?\",\"question_vi\":\"Bạn có biết thiết bị và cơ sở an toàn là gì không?\",\"answer_kr_hrd\":\"기계나 설비를 사용하는 작업자를 사고로부터 보호하기 위해 설치하는 보호설비입니다.\",\"answer_kr\":\"안전장치·시설은 작업자를 사고로부터 보호하는 설비입니다.\",\"answer_vi_hrd\":\"Là thiết bị bảo vệ được lắp đặt nhằm bảo vệ người lao động sử dụng máy móc hoặc thiết bị khỏi tai nạn.\",\"answer_vi\":\"Thiết bị/cơ sở an toàn là thiết bị bảo vệ người lao động khỏi tai nạn.\"},{\"id\":\"309\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_3\",\"obj\":[\"안전장치·시설 해체·해지 금지\",\"Cấm tháo dỡ hoặc vô hiệu hóa thiết bị và cơ sở an toàn\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"해체·해지가 무슨 뜻인지 알고 있나요?\",\"question_vi\":\"Bạn có biết tháo dỡ hoặc vô hiệu hóa có nghĩa là gì không?\",\"answer_kr_hrd\":\"기계,  장치,  구조물  등을  원래  상태에서  분리하거나  안전기능  등을 정지시키는  것입니다.\",\"answer_kr\":\"해체·해지는 장치를 분리하거나 안전기능을 멈추는 것입니다.\",\"answer_vi_hrd\":\"Là việc tháo rời máy móc, thiết bị, kết cấu, v.v. khỏi trạng thái ban đầu hoặc vô hiệu hóa chức năng an toàn.\",\"answer_vi\":\"Tháo dỡ/vô hiệu hóa là tháo thiết bị hoặc làm ngừng chức năng an toàn.\"},{\"id\":\"310\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_3\",\"obj\":[\"안전장치·시설 해체·해지 금지\",\"Cấm tháo dỡ hoặc vô hiệu hóa thiết bị và cơ sở an toàn\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"안전장치·시설을 왜 해체·해지하면 안 될까요?\",\"question_vi\":\"Tại sao không được tháo dỡ hoặc vô hiệu hóa thiết bị và cơ sở an toàn?\",\"answer_kr_hrd\":\"안전장치·시설을  해체·해지하면  기계가  고장나거나  사람이 실수했을  때  사고를  막아줄  수  없기  때문입니다.\",\"answer_kr\":\"안전장치를 해체하면 사고를 막을 수 없기 때문입니다.\",\"answer_vi_hrd\":\"Vì nếu tháo dỡ hoặc vô hiệu hóa thiết bị, cơ sở an toàn thì chúng không thể ngăn ngừa tai nạn khi máy bị hỏng hoặc con người mắc lỗi.\",\"answer_vi\":\"Không được tháo thiết bị an toàn vì sẽ không còn ngăn được tai nạn.\"},{\"id\":\"311\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_3\",\"obj\":[\"안전장치·시설 해체·해지 금지\",\"Cấm tháo dỡ hoặc vô hiệu hóa thiết bị và cơ sở an toàn\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"기계의 안전장치를 해체하고 작업하면 어떤 위험이 있나요?\",\"question_vi\":\"Nếu tháo dỡ thiết bị an toàn của máy móc và làm việc, có những nguy hiểm nào?\",\"answer_kr_hrd\":\"안전장치를  해체하고  작업하면  기계에  끼일  수  있습니다.\",\"answer_kr\":\"안전장치를 해체하고 작업하면 기계에 끼일 위험이 있습니다.\",\"answer_vi_hrd\":\"Nếu tháo thiết bị an toàn khi làm việc, có thể bị kẹt vào máy.\",\"answer_vi\":\"Nếu tháo thiết bị an toàn khi làm việc, có nguy cơ bị kẹt vào máy.\"},{\"id\":\"312\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_4\",\"obj\":[\"지정된 보조 도구·공구 사용\",\"Sử dụng công cụ phụ trợ được chỉ định\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"지정이 무슨 뜻인지 알고 있나요?\",\"question_vi\":\"Bạn có biết quy định có nghĩa là gì không?\",\"answer_kr_hrd\":\"사고를 방지하기 위해 사람이나 사물, 장소 등을 공식적으로 정해 놓는 것입니다.\",\"answer_kr\":\"지정은 사고 예방을 위해 사람, 물건, 장소를 정해 두는 것입니다.\",\"answer_vi_hrd\":\"Là việc chính thức quy định trước con người, đồ vật hoặc địa điểm, v.v. để phòng ngừa tai nạn.\",\"answer_vi\":\"Chỉ định là quy định người, vật hoặc địa điểm để phòng tai nạn.\"},{\"id\":\"313\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_4\",\"obj\":[\"지정된 보조 도구·공구 사용\",\"Sử dụng công cụ phụ trợ được chỉ định\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"보조 도구·공구가 무엇인가요?\",\"question_vi\":\"Công cụ phụ trợ là gì?\",\"answer_kr_hrd\":\"작업자가  작업을  할  때  사고를  방지하기  위하여  보완적으로  사용하는 장비나  기구입니다.\",\"answer_kr\":\"보조 도구·공구는 작업을 더 안전하게 돕는 도구입니다.\",\"answer_vi_hrd\":\"Là thiết bị hoặc dụng cụ bổ trợ được người lao động sử dụng khi làm việc để phòng ngừa tai nạn.\",\"answer_vi\":\"Dụng cụ phụ trợ là dụng cụ giúp làm việc an toàn hơn.\"},{\"id\":\"314\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_4\",\"obj\":[\"지정된 보조 도구·공구 사용\",\"Sử dụng công cụ phụ trợ được chỉ định\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"작업 시 왜 지정된 보조 도구·공구를 사용해야 할까요?\",\"question_vi\":\"Khi làm việc, tại sao phải sử dụng dụng cụ phụ trợ đã được chỉ định?\",\"answer_kr_hrd\":\"각  도구·공구는  특정  용도에  맞게  제작되어  있어  목적에  맞지 않게  사용하면  파손되거나  사고의  위험이  있기  때문입니다.\",\"answer_kr\":\"지정된 도구를 써야 파손과 사고를 막을 수 있기 때문입니다.\",\"answer_vi_hrd\":\"Vì mỗi dụng cụ, công cụ được chế tạo cho một mục đích cụ thể nên nếu sử dụng sai mục đích, chúng có thể bị hư hỏng hoặc gây nguy cơ tai nạn.\",\"answer_vi\":\"Cần dùng đúng dụng cụ đã quy định để tránh hư hỏng và tai nạn.\"},{\"id\":\"315\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_4\",\"obj\":[\"지정된 보조 도구·공구 사용\",\"Sử dụng công cụ phụ trợ được chỉ định\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"기계 작업 시 보조 도구를 사용하는 이유를 알고 있나요?\",\"question_vi\":\"Bạn có biết lý do tại sao phải sử dụng công cụ phụ trợ khi làm việc với máy móc không?\",\"answer_kr_hrd\":\"기계 작업 시 손이 끼이는 사고 등을 예방하기 위해 보조 도구를 사용합니다.\",\"answer_kr\":\"기계 작업 시 손 끼임 사고를 막기 위해 보조 도구를 사용합니다.\",\"answer_vi_hrd\":\"Khi làm việc với máy móc, cần sử dụng dụng cụ hỗ trợ để phòng ngừa các tai nạn như kẹt tay.\",\"answer_vi\":\"Khi làm việc với máy cần dùng dụng cụ phụ trợ để tránh kẹt tay.\"},{\"id\":\"316\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_5\",\"obj\":[\"지게차 운전 시 안전벨트 착용 및 시야 확보\",\"Đeo dây an toàn và đảm bảo tầm nhìn khi lái xe nâng\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"지게차가 무엇인가요?\",\"question_vi\":\"Xe nâng là gì?\",\"answer_kr_hrd\":\"무거운  화물이나  자재를  들어  올려  운반하거나  적재하는  데 사용하는  운반용  기계입니다.\",\"answer_kr\":\"지게차는 무거운 화물이나 자재를 들어 운반하는 기계입니다.\",\"answer_vi_hrd\":\"Là loại máy vận chuyển dùng để nâng, di chuyển hoặc xếp dỡ hàng hóa, vật liệu nặng.\",\"answer_vi\":\"Xe nâng là máy dùng để nâng và vận chuyển hàng nặng hoặc vật liệu.\"},{\"id\":\"317\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_5\",\"obj\":[\"지게차 운전 시 안전벨트 착용 및 시야 확보\",\"Đeo dây an toàn và đảm bảo tầm nhìn khi lái xe nâng\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"안전벨트가 무엇인가요?\",\"question_vi\":\"Dây an toàn là gì?\",\"answer_kr_hrd\":\"지게차  운전자가  충돌,  급정지,  넘어짐  등에  의하여  몸이  튕겨 나가는  것을  방지하기  위하여  착용하는  보호장비입니다.\",\"answer_kr\":\"안전벨트는 운전자가 튕겨 나가는 것을 막는 보호장비입니다.\",\"answer_vi_hrd\":\"Là thiết bị bảo hộ được người lái xe nâng sử dụng để ngăn cơ thể bị văng ra ngoài khi va chạm, phanh gấp hoặc xe bị lật.\",\"answer_vi\":\"Dây an toàn là thiết bị giúp người lái không bị văng ra ngoài.\"},{\"id\":\"318\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_5\",\"obj\":[\"지게차 운전 시 안전벨트 착용 및 시야 확보\",\"Đeo dây an toàn và đảm bảo tầm nhìn khi lái xe nâng\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"시야 확보는 무슨 뜻일까요?\",\"question_vi\":\"Đảm bảo tầm nhìn có nghĩa là gì?\",\"answer_kr_hrd\":\"지게차  운전자가  앞,  옆  및  뒷  쪽의  작업자,  장애물,  경사  등을 명확하게  확인하며  운전하는  것입니다.\",\"answer_kr\":\"시야 확보는 앞, 옆, 뒤를 잘 확인하며 운전하는 것입니다.\",\"answer_vi_hrd\":\"Là việc người lái xe nâng vận hành trong khi quan sát rõ người lao động, chướng ngại vật, độ dốc, v.v. ở phía trước, hai bên và phía sau.\",\"answer_vi\":\"Đảm bảo tầm nhìn là quan sát rõ phía trước, hai bên và phía sau khi lái.\"},{\"id\":\"319\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_5\",\"obj\":[\"지게차 운전 시 안전벨트 착용 및 시야 확보\",\"Đeo dây an toàn và đảm bảo tầm nhìn khi lái xe nâng\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"지게차 운전 시 왜 안전벨트를 착용하고 시야를 확보 해야 할까요?\",\"question_vi\":\"Tại sao khi lái xe nâng cần đeo dây an toàn và đảm bảo tầm nhìn?\",\"answer_kr_hrd\":\"안전벨트를  착용하고  시야를  확보하면  지게차  작업  중  운전자 및  동료의  사고를  막을  수  있기  때문입니다.\",\"answer_kr\":\"안전벨트와 시야 확보는 운전자와 동료의 사고를 막기 때문입니다.\",\"answer_vi_hrd\":\"Vì thắt dây an toàn và bảo đảm tầm nhìn có thể ngăn ngừa tai nạn cho người lái và đồng nghiệp trong quá trình vận hành xe nâng.\",\"answer_vi\":\"Dây an toàn và tầm nhìn tốt giúp phòng tai nạn cho người lái và đồng nghiệp.\"},{\"id\":\"320\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_5\",\"obj\":[\"지게차 운전 시 안전벨트 착용 및 시야 확보\",\"Đeo dây an toàn và đảm bảo tầm nhìn khi lái xe nâng\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"지게차를 운전할 수 있나요? 지게차는 누가 운전할 수 있나요?\",\"question_vi\":\"Bạn có thể lái xe nâng không? Ai có thể lái xe nâng?\",\"answer_kr_hrd\":\"대한민국에서 지게차는 자격이 있는 사람만이 운전할 수 있습니다. 아무나 운전할  수  없습니다.\",\"answer_kr\":\"지게차는 자격이 있는 사람만 운전할 수 있습니다.\",\"answer_vi_hrd\":\"Tại Hàn Quốc, chỉ người có đủ điều kiện mới được phép lái xe nâng. Không phải ai cũng có thể lái xe nâng.\",\"answer_vi\":\"Chỉ người có đủ điều kiện mới được lái xe nâng.\"},{\"id\":\"321\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_6\",\"obj\":[\"위험작업은 2인1조 작업\",\"Công việc nguy hiểm là công việc theo nhóm 2 người\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"위험작업이 무엇인가요?\",\"question_vi\":\"Công việc nguy hiểm là gì?\",\"answer_kr_hrd\":\"작업자의 신체 또는 생명에 위협을 받을 수 있는 위험요인이 존재하거나 사고  발생  가능성이  높은  작업입니다.\",\"answer_kr\":\"위험작업은 사고나 부상 위험이 높은 작업입니다.\",\"answer_vi_hrd\":\"Là công việc có yếu tố nguy hiểm có thể đe dọa cơ thể hoặc tính mạng người lao động, hoặc có khả năng xảy ra tai nạn cao.\",\"answer_vi\":\"Công việc nguy hiểm là công việc có nguy cơ tai nạn hoặc chấn thương cao.\"},{\"id\":\"322\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_6\",\"obj\":[\"위험작업은 2인1조 작업\",\"Công việc nguy hiểm là công việc theo nhóm 2 người\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"2인1조 작업이 무엇인가요?\",\"question_vi\":\"Công việc theo nhóm 2 người là gì?\",\"answer_kr_hrd\":\"한 명이 작업을 수행할 때 다른 한 명은 주변을 감시하거나 이상 상황 발생  시  즉시  조치할  수  있도록  함께  작업을  하는  것입니다.\",\"answer_kr\":\"2인1조 작업은 두 사람이 함께 하며 한 사람이 서로를 확인하는 작업입니다.\",\"answer_vi_hrd\":\"Là hình thức làm việc cùng nhau, trong đó một người thực hiện công việc còn người kia giám sát xung quanh hoặc có thể xử lý ngay khi xảy ra tình huống bất thường.\",\"answer_vi\":\"Làm việc theo nhóm 2 người là hai người cùng làm và hỗ trợ, giám sát nhau.\"},{\"id\":\"323\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_6\",\"obj\":[\"위험작업은 2인1조 작업\",\"Công việc nguy hiểm là công việc theo nhóm 2 người\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"위험작업은 왜 2인1조로 해야 할까요?\",\"question_vi\":\"Tại sao công việc nguy hiểm phải được thực hiện theo nhóm 2 người?\",\"answer_kr_hrd\":\"작업자의 상태를 실시간으로 감시하고 보호할 수 있으며 사고 발생 시 즉각적인  구조와  대응이  가능하기  때문입니다.\",\"answer_kr\":\"2인1조로 하면 사고 때 바로 구조하고 대응할 수 있기 때문입니다.\",\"answer_vi_hrd\":\"Vì có thể theo dõi và bảo vệ người lao động theo thời gian thực, đồng thời cứu hộ và ứng phó ngay khi xảy ra tai nạn.\",\"answer_vi\":\"Cần làm 2 người để có thể cứu hộ và xử lý ngay khi có sự cố.\"},{\"id\":\"324\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_6\",\"obj\":[\"위험작업은 2인1조 작업\",\"Công việc nguy hiểm là công việc theo nhóm 2 người\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"사다리 위에서 혼자 작업할 수 있나요?\",\"question_vi\":\"Bạn có thể làm việc một mình trên thang không?\",\"answer_kr_hrd\":\"사다리 위에서는 전구를 교체하는 것과 같이 간단한 작업만 할 수 있으며, 한  사람은  아래에서  사다리를  잡아줘야  합니다.\",\"answer_kr\":\"사다리 작업은 혼자 하지 말고 아래에서 한 사람이 잡아줘야 합니다.\",\"answer_vi_hrd\":\"Trên thang chỉ được thực hiện công việc đơn giản như thay bóng đèn và phải có một người giữ thang ở phía dưới.\",\"answer_vi\":\"Không nên làm việc trên thang một mình, cần có người giữ thang bên dưới.\"},{\"id\":\"325\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_7\",\"obj\":[\"중장비 작업구역 접근 금지\",\"Cấm tiếp cận khu vực làm việc của thiết bị nặng\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"중장비가  무엇인가요?\",\"question_vi\":\"Thiết bị nặng là gì?\",\"answer_kr_hrd\":\"크기와  중량이  크고  흙  운반,  땅  파기  등  대형  작업을  수행하기 위한  기계장비입니다.\",\"answer_kr\":\"중장비는 큰 작업을 하는 크고 무거운 기계장비입니다.\",\"answer_vi_hrd\":\"Là máy móc, thiết bị có kích thước và trọng lượng lớn, dùng để thực hiện các công việc quy mô lớn như vận chuyển đất hoặc đào đất.\",\"answer_vi\":\"Thiết bị nặng là máy móc lớn, nặng dùng cho công việc lớn.\"},{\"id\":\"326\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_7\",\"obj\":[\"중장비 작업구역 접근 금지\",\"Cấm tiếp cận khu vực làm việc của thiết bị nặng\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"작업구역이  무엇인가요?\",\"question_vi\":\"Khu vực làm việc là gì?\",\"answer_kr_hrd\":\"특정  작업이  이루어지는  공간으로  작업자가  실제로  일하거나 중장비가  작동하는  구역으로  사고  위험이  있는  영역입니다.\",\"answer_kr\":\"작업구역은 작업자가 일하거나 장비가 움직이는 위험 구역입니다.\",\"answer_vi_hrd\":\"Là không gian thực hiện một công việc cụ thể, nơi người lao động trực tiếp làm việc hoặc máy móc hạng nặng vận hành và có nguy cơ xảy ra tai nạn.\",\"answer_vi\":\"Khu vực làm việc là nơi người lao động làm việc hoặc máy móc hoạt động, có nguy cơ tai nạn.\"},{\"id\":\"327\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_7\",\"obj\":[\"중장비 작업구역 접근 금지\",\"Cấm tiếp cận khu vực làm việc của thiết bị nặng\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"중장비 작업구역은 왜 접근 금지 할까요?\",\"question_vi\":\"Tại sao khu vực làm việc của thiết bị nặng lại bị cấm tiếp cận?\",\"answer_kr_hrd\":\"중장비는  운전석에서  보지  못하는  공간이  매우  넓어  작업구역에 무단으로  접근하면  사망사고  발생  위험이  매우  높기  때문입니다.\",\"answer_kr\":\"중장비 주변은 사각지대가 많아 접근하면 매우 위험하기 때문입니다.\",\"answer_vi_hrd\":\"Vì máy móc hạng nặng có vùng khuất rất rộng mà người lái không thể quan sát từ buồng lái, nên tự ý đi vào khu vực làm việc có nguy cơ rất cao dẫn đến tai nạn chết người.\",\"answer_vi\":\"Không được lại gần thiết bị nặng vì có nhiều điểm mù rất nguy hiểm.\"},{\"id\":\"328\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_7\",\"obj\":[\"중장비 작업구역 접근 금지\",\"Cấm tiếp cận khu vực làm việc của thiết bị nặng\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"근처에서 중장비가 작업을 하고 있으면 어떻게 해야 하나요?\",\"question_vi\":\"Nếu có thiết bị nặng đang làm việc gần đó, bạn nên làm gì?\",\"answer_kr_hrd\":\"중장비가 작업하고 있는 작업 구역은 접근하지 않아야 합니다. 중장비 작업 구역은  접근  금지  구역입니다.\",\"answer_kr\":\"중장비 작업구역에는 접근하지 말아야 합니다.\",\"answer_vi_hrd\":\"Không được đi vào khu vực đang có máy móc hạng nặng hoạt động. Khu vực máy móc hạng nặng làm việc là khu vực cấm vào.\",\"answer_vi\":\"Không được vào khu vực làm việc của thiết bị nặng.\"},{\"id\":\"329\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_8\",\"obj\":[\"화재 가능 물질 주변 화기 금지\",\"Cấm sử dụng lửa gần các vật liệu có khả năng cháy\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"화재가 무엇인지 알고 있나요?\",\"question_vi\":\"Bạn có biết hỏa hoạn là gì không?\",\"answer_kr_hrd\":\"탈  수  있는  물질이  공기  중의  산소와  불꽃  등을  만나  열과  빛을  내며 타는  것입니다.\",\"answer_kr\":\"화재는 물질이 불에 타며 열과 빛을 내는 현상입니다.\",\"answer_vi_hrd\":\"Là hiện tượng vật liệu dễ cháy gặp oxy trong không khí và ngọn lửa, v.v. rồi bốc cháy, phát ra nhiệt và ánh sáng.\",\"answer_vi\":\"Cháy là hiện tượng vật liệu bắt lửa và tạo ra nhiệt, ánh sáng.\"},{\"id\":\"330\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_8\",\"obj\":[\"화재 가능 물질 주변 화기 금지\",\"Cấm sử dụng lửa gần các vật liệu có khả năng cháy\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"화기가 무엇인지 알고 있나요?\",\"question_vi\":\"Bạn có biết nguồn lửa là gì không?\",\"answer_kr_hrd\":\"작업  현장에서  불꽃,  불티,  열을  발생시킬  수  있는  모든  기구와 장치입니다.\",\"answer_kr\":\"화기는 불꽃, 불티, 열을 낼 수 있는 기구나 장치입니다.\",\"answer_vi_hrd\":\"Là tất cả dụng cụ và thiết bị có thể tạo ra ngọn lửa, tia lửa hoặc nhiệt tại nơi làm việc.\",\"answer_vi\":\"Nguồn lửa là dụng cụ hoặc thiết bị có thể tạo lửa, tia lửa hoặc nhiệt.\"},{\"id\":\"331\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_8\",\"obj\":[\"화재 가능 물질 주변 화기 금지\",\"Cấm sử dụng lửa gần các vật liệu có khả năng cháy\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"화재 가능 물질 주변에서 왜 화기를 금지할까요?\",\"question_vi\":\"Tại sao lại cấm sử dụng lửa gần các vật liệu có khả năng cháy?\",\"answer_kr_hrd\":\"화재  가능  물질이  주변에  있는  상황에서  화기를  사용하면  화재가 발생할  위험이  크기  때문입니다.\",\"answer_kr\":\"가연성 물질 주변에서 화기를 쓰면 화재 위험이 크기 때문입니다.\",\"answer_vi_hrd\":\"Vì sử dụng nguồn lửa khi xung quanh có vật liệu có khả năng bắt cháy sẽ làm tăng nguy cơ xảy ra hỏa hoạn.\",\"answer_vi\":\"Không dùng nguồn lửa gần vật dễ cháy vì nguy cơ cháy rất cao.\"},{\"id\":\"332\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_8\",\"obj\":[\"화재 가능 물질 주변 화기 금지\",\"Cấm sử dụng lửa gần các vật liệu có khả năng cháy\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"불에 잘 타는 물건이 근처에 있으면 용접작업 전에 어떻게 해야 하나요?\",\"question_vi\":\"Nếu có vật dễ cháy gần đó, bạn nên làm gì trước khi thực hiện công việc hàn?\",\"answer_kr_hrd\":\"불에  잘  타는  물건을  다른  곳으로  치운  후  작업해야  합니다.\",\"answer_kr\":\"용접 전에는 불에 잘 타는 물건을 치워야 합니다.\",\"answer_vi_hrd\":\"Phải di chuyển các vật dễ cháy sang nơi khác rồi mới tiến hành công việc.\",\"answer_vi\":\"Trước khi hàn cần dọn các vật dễ cháy ra xa.\"},{\"id\":\"333\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_8\",\"obj\":[\"화재 가능 물질 주변 화기 금지\",\"Cấm sử dụng lửa gần các vật liệu có khả năng cháy\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"불이 났을 때는 어떻게 해야 하나요?\",\"question_vi\":\"Bạn nên làm gì khi có hỏa hoạn xảy ra?\",\"answer_kr_hrd\":\"일반적인  화재  시  소화기를  사용하여  불을  끄거나  불을  끌  수  없을  때는 즉시  비상구로  대피해야  합니다.\",\"answer_kr\":\"불이 나면 소화기로 끄고, 끌 수 없으면 즉시 대피해야 합니다.\",\"answer_vi_hrd\":\"Khi xảy ra hỏa hoạn thông thường, phải dùng bình chữa cháy để dập lửa; nếu không thể dập được thì phải lập tức sơ tán qua cửa thoát hiểm.\",\"answer_vi\":\"Khi có cháy, dùng bình chữa cháy; nếu không dập được thì sơ tán ngay.\"},{\"id\":\"334\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_9\",\"obj\":[\"화학물질 작업 시 환기장치 가동\",\"Vận hành hệ thống thông gió khi làm việc với hóa chất\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"화학물질이 무엇인가요?\",\"question_vi\":\"Hóa chất là gì?\",\"answer_kr_hrd\":\"사업장에서  물건을  만드는  데  사용하는  고체,  액체,  기체로  사람에게 유해하거나  폭발  등의  위험성을  가진  물질입니다.\",\"answer_kr\":\"화학물질은 사람에게 해롭거나 폭발 위험이 있는 물질입니다.\",\"answer_vi_hrd\":\"Là các chất rắn, lỏng hoặc khí được sử dụng để sản xuất đồ vật tại nơi làm việc, có hại cho con người hoặc tiềm ẩn nguy cơ như cháy nổ.\",\"answer_vi\":\"Hóa chất là chất có thể gây hại cho người hoặc có nguy cơ cháy nổ.\"},{\"id\":\"335\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_9\",\"obj\":[\"화학물질 작업 시 환기장치 가동\",\"Vận hành hệ thống thông gió khi làm việc với hóa chất\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"환기장치가 무엇인가요?\",\"question_vi\":\"Hệ thống thông gió là gì?\",\"answer_kr_hrd\":\"실내의  유해물질을  제거하고  신선한  외부  공기를  내부로  공급하여 쾌적하고  안전하게  작업환경을  유지하는  설비입니다.\",\"answer_kr\":\"환기장치는 유해 공기를 빼고 신선한 공기를 넣는 설비입니다.\",\"answer_vi_hrd\":\"Là thiết bị loại bỏ các chất độc hại trong nhà và đưa không khí trong lành từ bên ngoài vào để duy trì môi trường làm việc thoải mái, an toàn.\",\"answer_vi\":\"Hệ thống thông gió là thiết bị hút khí độc ra và đưa không khí sạch vào.\"},{\"id\":\"336\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_9\",\"obj\":[\"화학물질 작업 시 환기장치 가동\",\"Vận hành hệ thống thông gió khi làm việc với hóa chất\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"화학물질 취급 시 왜 환기장치를 가동해야 할까요?\",\"question_vi\":\"Tại sao khi xử lý hóa chất phải vận hành hệ thống thông gió?\",\"answer_kr_hrd\":\"화학물질은  눈에  보이지  않는  유해  증기,  가스,  분진  등을 방출하는  경우가  많아  즉시  외부로  배출하지  않으면  건강에 해롭기  때문입니다.\",\"answer_kr\":\"화학물질의 유해가스를 밖으로 배출해야 건강을 지킬 수 있기 때문입니다.\",\"answer_vi_hrd\":\"Vì hóa chất thường phát tán hơi độc, khí độc hoặc bụi không nhìn thấy được, nếu không thải ngay ra bên ngoài thì sẽ gây hại cho sức khỏe.\",\"answer_vi\":\"Cần chạy thông gió để đưa khí độc từ hóa chất ra ngoài và bảo vệ sức khỏe.\"},{\"id\":\"337\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_9\",\"obj\":[\"화학물질 작업 시 환기장치 가동\",\"Vận hành hệ thống thông gió khi làm việc với hóa chất\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"화학물질을 다룰 때는 어떻게 해야 하나요?\",\"question_vi\":\"Khi xử lý hóa chất, bạn nên làm gì?\",\"answer_kr_hrd\":\"화학물질을 다룰 때는 환기장치를 가동해야 하고, 방독마스크, 화학물질용 보호장갑  등  보호구를  착용해야  합니다.\",\"answer_kr\":\"화학물질을 다룰 때는 환기하고 적절한 보호구를 착용해야 합니다.\",\"answer_vi_hrd\":\"Khi xử lý hóa chất, phải vận hành thiết bị thông gió và đeo dụng cụ bảo hộ như mặt nạ phòng độc, găng tay bảo hộ chống hóa chất.\",\"answer_vi\":\"Khi xử lý hóa chất cần thông gió và đeo thiết bị bảo hộ phù hợp.\"},{\"id\":\"338\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_10\",\"obj\":[\"통제구역 허가 없이 출입 금지\",\"Cấm vào khu vực kiểm soát mà không có giấy phép\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"통제구역이 무엇인가요?\",\"question_vi\":\"Khu vực kiểm soát là gì?\",\"answer_kr_hrd\":\"위험 요인이 있거나 사고가 발생할 수 있는 공간입니다.\",\"answer_kr\":\"통제구역은 위험해서 허가 없이 들어갈 수 없는 구역입니다.\",\"answer_vi_hrd\":\"Là khu vực có yếu tố nguy hiểm hoặc có thể xảy ra tai nạn.\",\"answer_vi\":\"Khu vực kiểm soát là khu vực nguy hiểm, không được vào nếu chưa được phép.\"},{\"id\":\"339\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_10\",\"obj\":[\"통제구역 허가 없이 출입 금지\",\"Cấm vào khu vực kiểm soát mà không có giấy phép\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"허가가 무슨 뜻인가요?\",\"question_vi\":\"Giấy phép có nghĩa là gì?\",\"answer_kr_hrd\":\"위험하거나  특별한  자격이  필요한  작업에  대하여  작업  전에 안전조건을  확인하고  그  조건을  충족했을  경우  작업  수행을 승인하는  것입니다.\",\"answer_kr\":\"허가는 안전 조건을 확인한 뒤 작업을 승인하는 것입니다.\",\"answer_vi_hrd\":\"Là việc kiểm tra các điều kiện an toàn trước khi thực hiện công việc nguy hiểm hoặc đòi hỏi năng lực đặc biệt, sau đó cho phép tiến hành nếu đáp ứng các điều kiện đó.\",\"answer_vi\":\"Giấy phép là việc kiểm tra điều kiện an toàn rồi cho phép làm việc.\"},{\"id\":\"340\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_10\",\"obj\":[\"통제구역 허가 없이 출입 금지\",\"Cấm vào khu vực kiểm soát mà không có giấy phép\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"통제구역은 왜 허가 없이 출입 금지 할까요?\",\"question_vi\":\"Tại sao khu vực kiểm soát lại bị cấm vào khi không có giấy phép?\",\"answer_kr_hrd\":\"통제구역은  일반구역보다  사고  위험이  높아  허가  없이  들어가는 것은  안전조치  없이  위험에  노출되는  것과  같기  때문입니다.\",\"answer_kr\":\"통제구역은 사고 위험이 높아 허가 없이 들어가면 위험하기 때문입니다.\",\"answer_vi_hrd\":\"Vì khu vực kiểm soát có nguy cơ tai nạn cao hơn khu vực thông thường, nên đi vào mà không được phép cũng giống như tiếp xúc với nguy hiểm khi chưa có biện pháp an toàn.\",\"answer_vi\":\"Không vào khu vực kiểm soát khi chưa được phép vì nguy cơ tai nạn cao.\"},{\"id\":\"341\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_10\",\"obj\":[\"통제구역 허가 없이 출입 금지\",\"Cấm vào khu vực kiểm soát mà không có giấy phép\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"출입 금지라는 뜻을 알고 있나요?\",\"question_vi\":\"Bạn có biết nghĩa của 'cấm vào' không?\",\"answer_kr_hrd\":\"사고 위험이 높아 아무나 들어가면 안되는 곳을 출입 금지라고 표시합니다.\",\"answer_kr\":\"출입 금지는 위험해서 들어가면 안 된다는 뜻입니다.\",\"answer_vi_hrd\":\"Những nơi có nguy cơ tai nạn cao và không phải ai cũng được vào sẽ được đánh dấu là khu vực cấm vào.\",\"answer_vi\":\"Cấm vào nghĩa là nơi nguy hiểm, không được đi vào.\"},{\"id\":\"342\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_11\",\"obj\":[\"중량물 들기는 허리 펴고 다리 힘을 이용\",\"Khi nâng vật nặng, hãy giữ lưng thẳng và sử dụng sức mạnh của chân\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"중량물이 무엇인지 알고 있나요?\",\"question_vi\":\"Bạn có biết vật nặng là gì không?\",\"answer_kr_hrd\":\"무겁고  사람이  쉽게  들거나  옮기기  어려운  물체로  운반  시  특별한 취급주의가  필요한  물건입니다.\",\"answer_kr\":\"중량물은 사람이 쉽게 들거나 옮기기 어려운 무거운 물건입니다.\",\"answer_vi_hrd\":\"Là vật nặng mà con người khó có thể dễ dàng nâng hoặc di chuyển, cần đặc biệt cẩn thận khi vận chuyển.\",\"answer_vi\":\"Vật nặng là vật khó nâng hoặc di chuyển bằng sức người.\"},{\"id\":\"343\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_11\",\"obj\":[\"중량물 들기는 허리 펴고 다리 힘을 이용\",\"Khi nâng vật nặng, hãy giữ lưng thẳng và sử dụng sức mạnh của chân\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"중량물 들기는 왜 허리 펴고 다리 힘을 이용해야 할까요?\",\"question_vi\":\"Tại sao khi nâng vật nặng phải giữ lưng thẳng và sử dụng sức mạnh của chân?\",\"answer_kr_hrd\":\"허리를  펴고  몸에서  가장  크고  강한  다리  근육을  사용하여 물건을  들어야  허리를  다치지  않을  수  있기  때문입니다.\",\"answer_kr\":\"허리 펴고 다리 힘으로 들어야 허리를 다치지 않기 때문입니다.\",\"answer_vi_hrd\":\"Vì phải giữ thẳng lưng và dùng cơ chân, nhóm cơ lớn và khỏe nhất của cơ thể, để nâng đồ vật thì mới tránh làm tổn thương lưng.\",\"answer_vi\":\"Giữ lưng thẳng và dùng sức chân để nâng để tránh bị đau lưng.\"},{\"id\":\"344\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_11\",\"obj\":[\"중량물 들기는 허리 펴고 다리 힘을 이용\",\"Khi nâng vật nặng, hãy giữ lưng thẳng và sử dụng sức mạnh của chân\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"무거운 물건은 어떻게 들어야 하나요?\",\"question_vi\":\"Bạn nên nâng vật nặng như thế nào?\",\"answer_kr_hrd\":\"무거운 물건은 두 사람 이상이 들거나 장비를 사용해야 하며, 혼자 들 수 있는  경우에는  허리를  펴고  다리의  힘으로  들어야  합니다.\",\"answer_kr\":\"무거운 물건은 두 사람 이상이 들거나 장비를 사용해야 합니다.\",\"answer_vi_hrd\":\"Vật nặng phải do ít nhất hai người cùng nâng hoặc sử dụng thiết bị hỗ trợ; nếu có thể nâng một mình thì phải giữ thẳng lưng và dùng lực chân.\",\"answer_vi\":\"Vật nặng nên được nâng bởi hai người trở lên hoặc dùng thiết bị hỗ trợ.\"},{\"id\":\"345\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_12\",\"obj\":[\"중량물 운반 시 운반기구 활용\",\"Sử dụng thiết bị vận chuyển khi vận chuyển vật nặng\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"운반이 무엇인가요?\",\"question_vi\":\"Vận chuyển là gì?\",\"answer_kr_hrd\":\"작업자가 직접 물건이나 자재를 들기, 밀기, 당기기 등으로 한 장소에서 다른  장소로  이동시키는  행위입니다.\",\"answer_kr\":\"운반은 물건을 한 장소에서 다른 장소로 옮기는 것입니다.\",\"answer_vi_hrd\":\"Là hành vi người lao động trực tiếp di chuyển đồ vật hoặc vật liệu từ nơi này sang nơi khác bằng cách nâng, đẩy, kéo, v.v.\",\"answer_vi\":\"Vận chuyển là đưa đồ vật từ nơi này sang nơi khác.\"},{\"id\":\"346\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_12\",\"obj\":[\"중량물 운반 시 운반기구 활용\",\"Sử dụng thiết bị vận chuyển khi vận chuyển vật nặng\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"운반 기구가 무엇인가요?\",\"question_vi\":\"Thiết bị vận chuyển là gì?\",\"answer_kr_hrd\":\"작업자가  물건이나  자재를  보다  안전하고  효율적으로  옮기기  위해 사용하는  도구나  장비입니다.\",\"answer_kr\":\"운반 기구는 물건을 안전하고 쉽게 옮기는 도구입니다.\",\"answer_vi_hrd\":\"Là dụng cụ hoặc thiết bị được người lao động sử dụng để di chuyển đồ vật, vật liệu an toàn và hiệu quả hơn.\",\"answer_vi\":\"Dụng cụ vận chuyển là công cụ giúp di chuyển đồ vật an toàn và dễ hơn.\"},{\"id\":\"347\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_12\",\"obj\":[\"중량물 운반 시 운반기구 활용\",\"Sử dụng thiết bị vận chuyển khi vận chuyển vật nặng\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"중량물 운반 시 왜 운반기구를 활용해야 할까요?\",\"question_vi\":\"Tại sao khi vận chuyển vật nặng phải sử dụng thiết bị vận chuyển?\",\"answer_kr_hrd\":\"작업자가  무거운  물건을  몸을  사용하여  운반할  경우  허리  등을 다칠  위험이  크기  때문입니다.\",\"answer_kr\":\"운반기구를 사용하면 허리 부상 위험을 줄일 수 있기 때문입니다.\",\"answer_vi_hrd\":\"Vì nếu người lao động dùng sức mình để vận chuyển vật nặng thì có nguy cơ cao bị thương ở lưng và các bộ phận khác.\",\"answer_vi\":\"Cần dùng dụng cụ vận chuyển để giảm nguy cơ chấn thương lưng.\"},{\"id\":\"348\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_12\",\"obj\":[\"중량물 운반 시 운반기구 활용\",\"Sử dụng thiết bị vận chuyển khi vận chuyển vật nặng\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"무거운 물건을 옮길 때에는 어떻게 해야 하나요?\",\"question_vi\":\"Khi di chuyển vật nặng, bạn nên làm gì?\",\"answer_kr_hrd\":\"무거운  물건을  옮길  때에는  운반기구를  사용합니다.\",\"answer_kr\":\"무거운 물건을 옮길 때는 운반기구를 사용해야 합니다.\",\"answer_vi_hrd\":\"Khi di chuyển vật nặng, phải sử dụng dụng cụ vận chuyển.\",\"answer_vi\":\"Khi di chuyển vật nặng cần dùng dụng cụ vận chuyển.\"},{\"id\":\"349\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_13\",\"obj\":[\"이동 시 안전통로 이용\",\"Sử dụng lối đi an toàn khi di chuyển\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"이동이 무엇인가요?\",\"question_vi\":\"Di chuyển là gì?\",\"answer_kr_hrd\":\"작업자가  한  장소에서  다른  장소로  위치를  옮기는  행위입니다.\",\"answer_kr\":\"이동은 한 장소에서 다른 장소로 옮겨 가는 것입니다.\",\"answer_vi_hrd\":\"\",\"answer_vi\":\"Di chuyển là đi từ nơi này sang nơi khác.\"},{\"id\":\"350\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_13\",\"obj\":[\"이동 시 안전통로 이용\",\"Sử dụng lối đi an toàn khi di chuyển\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"안전통로가 무엇인가요?\",\"question_vi\":\"Lối đi an toàn là gì?\",\"answer_kr_hrd\":\"작업자가  위험을  피하면서  안전하게  이동할  수  있도록  확보된 통행  공간입니다.\",\"answer_kr\":\"안전통로는 작업자가 안전하게 다니는 통로입니다.\",\"answer_vi_hrd\":\"\",\"answer_vi\":\"Lối đi an toàn là lối để người lao động đi lại an toàn.\"},{\"id\":\"351\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_13\",\"obj\":[\"이동 시 안전통로 이용\",\"Sử dụng lối đi an toàn khi di chuyển\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"이동 시 왜 안전통로를 이용해야 할까요?\",\"question_vi\":\"Tại sao khi di chuyển phải sử dụng lối đi an toàn?\",\"answer_kr_hrd\":\"장애물,  기계  등  위험요인이  없는  안전통로를  이용해야  작업자가 안전하게  위치를  옮길  수  있기  때문입니다.\",\"answer_kr\":\"안전통로를 이용해야 장애물과 기계 위험을 피할 수 있기 때문입니다.\",\"answer_vi_hrd\":\"\",\"answer_vi\":\"Cần đi lối an toàn để tránh chướng ngại vật và nguy hiểm từ máy móc.\"},{\"id\":\"352\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_14\",\"obj\":[\"작업 중 휴대폰 사용 금지\",\"Cấm sử dụng điện thoại di động khi đang làm việc\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"작업 중이란 무슨 뜻인가요?\",\"question_vi\":\"Bạn có biết 'đang làm việc' có nghĩa là gì không?\",\"answer_kr_hrd\":\"작업자가  업무와  관련된  모든  행위를  수행하는  시간이나  상태입니다.\",\"answer_kr\":\"작업 중이란 작업자가 업무와 관련된 모든 행위를 수행하는 시간이나 상태입니다.\",\"answer_vi_hrd\":\"Là thời gian hoặc trạng thái người lao động đang thực hiện mọi hoạt động liên quan đến công việc.\",\"answer_vi\":\"Đang làm việc là trạng thái và thời gian mà người lao động thực hiện các động tác liên quan đến công việc.\"},{\"id\":\"353\",\"type\":\"an-toan-suc-khoe-2\",\"group\":\"atsk_2_14\",\"obj\":[\"작업 중 휴대폰 사용 금지\",\"Cấm sử dụng điện thoại di động khi đang làm việc\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"작업 중 왜 휴대폰을 사용하면 안 될까요?\",\"question_vi\":\"Tại sao khi đang làm việc lại không được sử dụng điện thoại di động?\",\"answer_kr_hrd\":\"작업  중  휴대폰을  사용하면  작업자의  주의가  분산되어  업무에 집중할  수  없고  사고의  위험이  급격하게  증가하기  때문입니다.\",\"answer_kr\":\"작업 중 휴대폰을 쓰면 집중력이 떨어져 사고 위험이 높아지기 때문입니다.\",\"answer_vi_hrd\":\"Vì sử dụng điện thoại trong lúc làm việc khiến người lao động mất tập trung, không thể tập trung vào công việc và làm nguy cơ tai nạn tăng mạnh.\",\"answer_vi\":\"Không dùng điện thoại khi làm việc vì mất tập trung dẫn đến nguy cơ tai nạn cao.\"},{\"id\":\"354\",\"type\":\"an-toan-suc-khoe-3\",\"group\":\"atsk_3_1\",\"obj\":[\"정리정돈 및 청소\",\"Sắp xếp và dọn dẹp\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"정리정돈이 무슨 뜻인가요?\",\"question_vi\":\"Bạn có biết 'sắp xếp' có nghĩa là gì không?\",\"answer_kr_hrd\":\"안전사고  예방과  작업  효율  향상을  위하여  물건을  정해진  위치에 가지런히  놓고  주변  환경을  깨끗하게  유지하는  활동입니다.\",\"answer_kr\":\"정리정돈은 물건을 제자리에 두고 주변을 깨끗하게 하는 것입니다.\",\"answer_vi_hrd\":\"Là hoạt động sắp xếp đồ vật ngay ngắn tại vị trí đã định và giữ môi trường xung quanh sạch sẽ để phòng ngừa tai nạn và nâng cao hiệu quả công việc.\",\"answer_vi\":\"Sắp xếp gọn gàng là để đồ đúng chỗ và giữ nơi làm việc sạch sẽ.\"},{\"id\":\"355\",\"type\":\"an-toan-suc-khoe-3\",\"group\":\"atsk_3_1\",\"obj\":[\"정리정돈 및 청소\",\"Sắp xếp và dọn dẹp\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"청소가 무슨 뜻인가요?\",\"question_vi\":\"Bạn có biết 'dọn dẹp' có nghĩa là gì không?\",\"answer_kr_hrd\":\"작업장이나  시설  내의  먼지,  쓰레기,  기름,  이물질  등을  제거하여 깨끗하게  유지하는  활동입니다.\",\"answer_kr\":\"청소는 먼지, 쓰레기, 기름 등을 치우는 것입니다.\",\"answer_vi_hrd\":\"Là hoạt động loại bỏ bụi, rác, dầu mỡ, tạp chất, v.v. trong nơi làm việc hoặc cơ sở để duy trì sự sạch sẽ.\",\"answer_vi\":\"Dọn dẹp là loại bỏ bụi, rác, dầu mỡ và chất bẩn.\"},{\"id\":\"356\",\"type\":\"an-toan-suc-khoe-3\",\"group\":\"atsk_3_1\",\"obj\":[\"정리정돈 및 청소\",\"Sắp xếp và dọn dẹp\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"작업장에서 정리정돈 및 청소 왜 해야 할까요?\",\"question_vi\":\"Tại sao phải sắp xếp và dọn dẹp tại nơi làm việc?\",\"answer_kr_hrd\":\"필요한  물건을  쉽고  빠르게  찾아  사용할  수  있고,  흩어진  공구나 이물질은  넘어짐,  미끄러짐  등  사고의  원인이  되기  때문입니다.\",\"answer_kr\":\"정리정돈과 청소를 해야 넘어짐과 미끄러짐 사고를 막을 수 있기 때문입니다.\",\"answer_vi_hrd\":\"Vì có thể tìm và sử dụng vật dụng cần thiết dễ dàng, nhanh chóng; còn công cụ hoặc tạp chất nằm rải rác có thể gây ra tai nạn như vấp ngã, trượt ngã.\",\"answer_vi\":\"Cần sắp xếp và dọn dẹp để tránh vấp ngã, trượt ngã.\"},{\"id\":\"357\",\"type\":\"an-toan-suc-khoe-3\",\"group\":\"atsk_3_2\",\"obj\":[\"공구는 지정된 자리에 두기\",\"Đặt công cụ vào vị trí đã định\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"공구가 무엇인가요?\",\"question_vi\":\"Công cụ là gì?\",\"answer_kr_hrd\":\"작업을  도와주며  보다  쉽고  정확하게  일을  수행하기  위해  사용하는 도구나  기구입니다.\",\"answer_kr\":\"공구는 작업을 쉽고 정확하게 돕는 도구입니다.\",\"answer_vi_hrd\":\"Là dụng cụ hoặc thiết bị được sử dụng để hỗ trợ và giúp thực hiện công việc dễ dàng, chính xác hơn.\",\"answer_vi\":\"Công cụ là dụng cụ giúp làm việc dễ và chính xác hơn.\"},{\"id\":\"358\",\"type\":\"an-toan-suc-khoe-3\",\"group\":\"atsk_3_2\",\"obj\":[\"공구는 지정된 자리에 두기\",\"Đặt công cụ vào vị trí đã định\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"지정된 자리가 무슨 뜻인가요?\",\"question_vi\":\"Vị trí đã định có nghĩa là gì?\",\"answer_kr_hrd\":\"사고  예방과  작업  효율성  확보를  위해  사전에  정해진  위치나  장소로 특정  물건이나  사람이  있어야  할  곳입니다.\",\"answer_kr\":\"지정된 자리는 물건을 두도록 미리 정해 놓은 위치입니다.\",\"answer_vi_hrd\":\"Là vị trí hoặc địa điểm được xác định trước để phòng ngừa tai nạn và bảo đảm hiệu quả công việc, nơi một đồ vật hoặc người cụ thể phải ở.\",\"answer_vi\":\"Vị trí quy định là nơi đã được định sẵn để đặt đồ.\"},{\"id\":\"359\",\"type\":\"an-toan-suc-khoe-3\",\"group\":\"atsk_3_2\",\"obj\":[\"공구는 지정된 자리에 두기\",\"Đặt công cụ vào vị trí đã định\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"공구를 왜 지정된 자리에 두어야 할까요?\",\"question_vi\":\"Tại sao phải đặt công cụ vào vị trí đã định?\",\"answer_kr_hrd\":\"공구가 분실되거나 파손될 위험이 있으며 바닥, 통로, 기계 위에 있으면 사고  발생위험이  크기  때문입니다.\",\"answer_kr\":\"공구를 제자리에 두어야 분실, 파손, 사고를 막을 수 있기 때문입니다.\",\"answer_vi_hrd\":\"Vì công cụ có nguy cơ bị thất lạc hoặc hư hỏng, và nếu nằm trên sàn, lối đi hoặc máy móc thì nguy cơ xảy ra tai nạn sẽ rất cao.\",\"answer_vi\":\"Cần để công cụ đúng chỗ để tránh mất, hỏng và tai nạn.\"},{\"id\":\"360\",\"type\":\"an-toan-suc-khoe-3\",\"group\":\"atsk_3_3\",\"obj\":[\"손 씻기 등 위생관리 철저\",\"Thực hiện nghiêm việc vệ sinh như rửa tay\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"위생관리가 무엇인가요?\",\"question_vi\":\"Quản lý vệ sinh là gì?\",\"answer_kr_hrd\":\"작업자와  작업환경의  청결을  유지하고  유해요인으로부터  건강을 보호하기  위한  모든  관리  활동입니다.\",\"answer_kr\":\"위생관리는 몸과 작업환경을 깨끗하게 유지하는 관리입니다.\",\"answer_vi_hrd\":\"Là toàn bộ hoạt động quản lý nhằm giữ sạch người lao động và môi trường làm việc, đồng thời bảo vệ sức khỏe khỏi các yếu tố có hại.\",\"answer_vi\":\"Quản lý vệ sinh là giữ cơ thể và môi trường làm việc sạch sẽ.\"},{\"id\":\"361\",\"type\":\"an-toan-suc-khoe-3\",\"group\":\"atsk_3_3\",\"obj\":[\"손 씻기 등 위생관리 철저\",\"Thực hiện nghiêm việc vệ sinh như rửa tay\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"손 씻기 등 위생관리를 왜 해야 할까요?\",\"question_vi\":\"Tại sao phải thực hiện quản lý vệ sinh như rửa tay?\",\"answer_kr_hrd\":\"작업장에서  발생하는  이물질이나  화학약품이  손,  입,  눈,  피부를 통해  몸속으로  들어가  질병을  유발할  수  있기  때문입니다.\",\"answer_kr\":\"손을 씻어야 이물질과 화학물질이 몸에 들어가는 것을 막을 수 있기 때문입니다.\",\"answer_vi_hrd\":\"Vì tạp chất hoặc hóa chất phát sinh tại nơi làm việc có thể đi vào cơ thể qua tay, miệng, mắt hoặc da và gây bệnh.\",\"answer_vi\":\"Cần rửa tay để ngăn bụi bẩn và hóa chất đi vào cơ thể.\"},{\"id\":\"362\",\"type\":\"an-toan-suc-khoe-3\",\"group\":\"atsk_3_3\",\"obj\":[\"손 씻기 등 위생관리 철저\",\"Thực hiện nghiêm việc vệ sinh như rửa tay\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"작업 후 밥 먹기 전에 무엇을 해야 하나요?\",\"question_vi\":\"Bạn nên làm gì trước khi ăn sau khi làm việc?\",\"answer_kr_hrd\":\"밥 먹기 전에는 손을 깨끗이 씻어야 합니다.\",\"answer_kr\":\"밥 먹기 전에는 손을 깨끗이 씻어야 합니다.\",\"answer_vi_hrd\":\"Trước khi ăn phải rửa tay sạch sẽ.\",\"answer_vi\":\"Trước khi ăn cần rửa tay sạch sẽ.\"},{\"id\":\"363\",\"type\":\"an-toan-suc-khoe-3\",\"group\":\"atsk_3_4\",\"obj\":[\"청소·수리 작업 시 기계 전원 차단\",\"Tắt nguồn máy khi làm việc dọn dẹp hoặc sửa chữa\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"청소·수리 작업이 무엇인가요?\",\"question_vi\":\"Công việc dọn dẹp hoặc sửa chữa là gì?\",\"answer_kr_hrd\":\"기계나 설비의 이물질을 제거하거나 고장 난 부분을 교체하거나 복구하기 위해  실시하는  작업입니다.\",\"answer_kr\":\"청소·수리 작업은 기계를 청소하거나 고장 난 부분을 고치는 작업입니다.\",\"answer_vi_hrd\":\"Là công việc loại bỏ tạp chất khỏi máy móc, thiết bị hoặc thay thế, sửa chữa các bộ phận bị hỏng.\",\"answer_vi\":\"Công việc vệ sinh/sửa chữa là làm sạch máy hoặc sửa phần bị hỏng.\"},{\"id\":\"364\",\"type\":\"an-toan-suc-khoe-3\",\"group\":\"atsk_3_4\",\"obj\":[\"청소·수리 작업 시 기계 전원 차단\",\"Tắt nguồn máy khi làm việc dọn dẹp hoặc sửa chữa\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"전원 차단이 무슨 뜻인가요?\",\"question_vi\":\"Bạn có biết 'tắt nguồn' có nghĩa là gì không?\",\"answer_kr_hrd\":\"기계, 설비의 갑작스러운 작동을 방지하기 위하여 공급되는 전기 등을 완전히  끊는  조치입니다.\",\"answer_kr\":\"전원 차단은 기계의 전기를 완전히 끊는 것입니다.\",\"answer_vi_hrd\":\"Là biện pháp ngắt hoàn toàn nguồn điện, v.v. được cấp cho máy móc, thiết bị nhằm ngăn chúng đột ngột hoạt động.\",\"answer_vi\":\"Ngắt nguồn điện là cắt hoàn toàn điện của máy.\"},{\"id\":\"365\",\"type\":\"an-toan-suc-khoe-3\",\"group\":\"atsk_3_4\",\"obj\":[\"청소·수리 작업 시 기계 전원 차단\",\"Tắt nguồn máy khi làm việc dọn dẹp hoặc sửa chữa\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"청소·수리 작업 시 왜 기계 전원을 차단해야 할까요?\",\"question_vi\":\"Tại sao khi làm việc dọn dẹp hoặc sửa chữa phải tắt nguồn máy?\",\"answer_kr_hrd\":\"청소·수리  작업은  작업자가  기계  내부나  위험한  부위에  직접 접근해야  하는  고위험  작업이기  때문입니다.\",\"answer_kr\":\"기계가 갑자기 작동하는 것을 막기 위해서입니다.\",\"answer_vi_hrd\":\"Vì vệ sinh và sửa chữa là công việc có độ nguy hiểm cao, đòi hỏi người lao động phải trực tiếp tiếp cận bên trong máy hoặc các bộ phận nguy hiểm.\",\"answer_vi\":\"Để ngăn máy bất ngờ hoạt động.\"},{\"id\":\"366\",\"type\":\"an-toan-suc-khoe-3\",\"group\":\"atsk_3_4\",\"obj\":[\"청소·수리 작업 시 기계 전원 차단\",\"Tắt nguồn máy khi làm việc dọn dẹp hoặc sửa chữa\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"기계의 청소·수리 작업 전에는 무엇을 해야 하나요?\",\"question_vi\":\"Bạn nên làm gì trước khi thực hiện công việc dọn dẹp hoặc sửa chữa máy móc?\",\"answer_kr_hrd\":\"기계의  청소·수리  전에는  전원을  차단해야  합니다.\",\"answer_kr\":\"청소·수리 전에는 기계 전원을 차단해야 합니다.\",\"answer_vi_hrd\":\"Trước khi vệ sinh hoặc sửa chữa máy, phải ngắt nguồn điện.\",\"answer_vi\":\"Trước khi vệ sinh hoặc sửa chữa cần ngắt nguồn điện của máy.\"},{\"id\":\"367\",\"type\":\"an-toan-suc-khoe-3\",\"group\":\"atsk_3_5\",\"obj\":[\"화기 취급 시 불씨·불티 확인\",\"Kiểm tra tàn lửa và tia lửa khi xử lý nguồn lửa\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"화기 취급이 무엇인가요?\",\"question_vi\":\"Bạn có biết 'xử lý nguồn lửa' có nghĩa là gì không?\",\"answer_kr_hrd\":\"작업  현장에서  불꽃,  불티,  열을  발생시킬  수  있는  모든  기구와 장치입니다.\",\"answer_kr\":\"화기 취급은 불을 사용하거나 다루는 것입니다.\",\"answer_vi_hrd\":\"Là tất cả dụng cụ và thiết bị có thể tạo ra ngọn lửa, tia lửa hoặc nhiệt tại nơi làm việc.\",\"answer_vi\":\"Xử lý/sử dụng nguồn lửa là việc sử dụng hoặc thao tác với lửa.\"},{\"id\":\"368\",\"type\":\"an-toan-suc-khoe-3\",\"group\":\"atsk_3_5\",\"obj\":[\"화기 취급 시 불씨·불티 확인\",\"Kiểm tra tàn lửa và tia lửa khi xử lý nguồn lửa\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"불씨·불티가 무엇인가요?\",\"question_vi\":\"Bạn có biết 'tàn lửa và tia lửa' có nghĩa là gì không?\",\"answer_kr_hrd\":\"완전히 꺼지지 않은 작은 불덩이 또는 불꽃으로 눈에는 잘 안 보이지만 오랜  시간  열을  유지하는  작고  뜨거운  열원입니다.\",\"answer_kr\":\"불씨·불티는 불이 붙을 수 있는 작은 불꽃입니다.\",\"answer_vi_hrd\":\"Là cục than hồng hoặc tia lửa nhỏ chưa tắt hoàn toàn; dù khó nhìn thấy nhưng đây là nguồn nhiệt nhỏ, nóng và có thể duy trì nhiệt trong thời gian dài.\",\"answer_vi\":\"Tàn lửa, tia lửa là những đốm lửa nhỏ có thể gây cháy.\"},{\"id\":\"369\",\"type\":\"an-toan-suc-khoe-3\",\"group\":\"atsk_3_5\",\"obj\":[\"화기 취급 시 불씨·불티 확인\",\"Kiểm tra tàn lửa và tia lửa khi xử lý nguồn lửa\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"화기 취급 시 왜 불씨·불티를 확인해야 할까요?\",\"question_vi\":\"Tại sao khi xử lý nguồn lửa phải kiểm tra tàn lửa và tia lửa?\",\"answer_kr_hrd\":\"불씨·불티가  남아  있을  경우,  시간이  지나고  나서  예상하지  못한 장소에서  화재가  발생할  수  있기  때문입니다.\",\"answer_kr\":\"불씨·불티가 남아 있으면 나중에 화재가 날 수 있기 때문입니다.\",\"answer_vi_hrd\":\"Vì nếu còn sót lại tàn lửa hoặc tia lửa, sau một thời gian có thể xảy ra hỏa hoạn tại nơi không ngờ tới.\",\"answer_vi\":\"Cần kiểm tra vì tàn lửa, tia lửa còn sót lại có thể gây cháy sau đó.\"},{\"id\":\"370\",\"type\":\"an-toan-suc-khoe-3\",\"group\":\"atsk_3_5\",\"obj\":[\"화기 취급 시 불씨·불티 확인\",\"Kiểm tra tàn lửa và tia lửa khi xử lý nguồn lửa\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"소화기를 사용할 줄 아나요? 소화기 사용 시 제일 먼저 해야 하는 것은?\",\"question_vi\":\"Bạn có biết cách sử dụng bình chữa cháy không? Khi sử dụng bình chữa cháy, điều đầu tiên phải làm là gì?\",\"answer_kr_hrd\":\"소화기를  사용할  때는  안전핀을  먼저  뽑아야  합니다.  화기  작업  할  때는 소화기를  근처에  두어야  합니다.\",\"answer_kr\":\"네, 사용할 줄 압니다. 소화기 사용 시 제일 먼저 해야 하는 것은 안전핀을 뽑는 것입니다.\",\"answer_vi_hrd\":\"Khi sử dụng bình chữa cháy, trước tiên phải rút chốt an toàn. Khi thực hiện công việc có nguồn lửa, phải đặt bình chữa cháy ở gần.\",\"answer_vi\":\"Vâng, tôi biết cách sử dụng. Khi sử dụng bình chữa cháy, điều đầu tiên phải làm là rút chốt an toàn.\"},{\"id\":\"371\",\"type\":\"an-toan-suc-khoe-4\",\"group\":\"atsk_4_1\",\"obj\":[\"화재 시 대피 우선\",\"Ưu tiên sơ tán khi có cháy\"],\"level\":\"1\",\"timer\":\"\",\"question_kr\":\"화재가 무엇인가요?\",\"question_vi\":\"Bạn có biết 'cháy' có nghĩa là gì không?\",\"answer_kr_hrd\":\"탈  수  있는  물질이  공기  중의  산소와  불꽃  등을  만나  열과  빛을  내며 타는  것입니다.\",\"answer_kr\":\"화재는 물질이 불에 타며 열과 빛을 내는 현상입니다.\",\"answer_vi_hrd\":\"Là hiện tượng vật liệu dễ cháy gặp oxy trong không khí và ngọn lửa, v.v. rồi bốc cháy, phát ra nhiệt và ánh sáng.\",\"answer_vi\":\"Cháy là hiện tượng vật liệu bắt lửa và tạo ra nhiệt, ánh sáng.\"},{\"id\":\"372\",\"type\":\"an-toan-suc-khoe-4\",\"group\":\"atsk_4_1\",\"obj\":[\"화재 시 대피 우선\",\"Ưu tiên sơ tán khi có cháy\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"대피가 무엇인가요?\",\"question_vi\":\"Bạn có biết 'sơ tán' có nghĩa là gì không?\",\"answer_kr_hrd\":\"화재 등 위험한 상황이 발생했을 때, 작업자의 생명과 신체를 보호하기 위해  안전한  장소로  신속히  이동하는  행위입니다.\",\"answer_kr\":\"대피는 위험할 때 안전한 곳으로 빨리 이동하는 것입니다.\",\"answer_vi_hrd\":\"Là hành động nhanh chóng di chuyển đến nơi an toàn để bảo vệ tính mạng và cơ thể người lao động khi xảy ra tình huống nguy hiểm như hỏa hoạn.\",\"answer_vi\":\"Sơ tán là nhanh chóng di chuyển đến nơi an toàn khi có nguy hiểm.\"},{\"id\":\"373\",\"type\":\"an-toan-suc-khoe-4\",\"group\":\"atsk_4_1\",\"obj\":[\"화재 시 대피 우선\",\"Ưu tiên sơ tán khi có cháy\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"화재 시 왜 대피가 우선일까요?\",\"question_vi\":\"Bạn có biết tại sao khi có cháy, ưu tiên là sơ tán không?\",\"answer_kr_hrd\":\"화재가  발생하면  불길보다  연기,  유독가스  등이  생명을 위협하고  재산보다는  사람의  생명이  우선이기  때문입니다.\",\"answer_kr\":\"화재 때는 사람의 생명이 재산보다 중요하기 때문입니다.\",\"answer_vi_hrd\":\"Vì khi xảy ra hỏa hoạn, khói và khí độc đe dọa tính mạng nhiều hơn ngọn lửa, đồng thời tính mạng con người phải được ưu tiên hơn tài sản.\",\"answer_vi\":\"Khi có cháy, tính mạng con người quan trọng hơn tài sản.\"},{\"id\":\"374\",\"type\":\"an-toan-suc-khoe-4\",\"group\":\"atsk_4_1\",\"obj\":[\"화재 시 대피 우선\",\"Ưu tiên sơ tán khi có cháy\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"119 전화번호를 알고 있나요?\",\"question_vi\":\"Bạn có biết số điện thoại 119 không?\",\"answer_kr_hrd\":\"119 번호는 대한민국에서 불이 났을 때나 응급환자가 생겼을 때 소방서로 연결되는  전화번호입니다.\",\"answer_kr\":\"119는 한국에서 화재나 응급상황 때 신고하는 전화번호입니다.\",\"answer_vi_hrd\":\"Tại Hàn Quốc, 119 là số điện thoại kết nối với cơ quan cứu hỏa khi xảy ra hỏa hoạn hoặc có bệnh nhân cần cấp cứu.\",\"answer_vi\":\"119 là số điện thoại báo cháy hoặc cấp cứu ở Hàn Quốc.\"},{\"id\":\"375\",\"type\":\"an-toan-suc-khoe-4\",\"group\":\"atsk_4_2\",\"obj\":[\"모르는 작업은 물어보기\",\"Hỏi về công việc không biết\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"모르는 작업이 무슨 뜻인가요?\",\"question_vi\":\"Bạn có biết 'công việc không biết' có nghĩa là gì không?\",\"answer_kr_hrd\":\"작업자가 작업 내용이나 방법을 정확히 알지 못하거나 충분한 교육 없이 수행하게  되는  작업입니다.\",\"answer_kr\":\"모르는 작업은 방법을 정확히 모르고 하는 작업입니다.\",\"answer_vi_hrd\":\"Là công việc mà người lao động không biết chính xác nội dung hoặc phương pháp thực hiện, hoặc phải làm khi chưa được đào tạo đầy đủ.\",\"answer_vi\":\"Công việc không biết là công việc mình chưa nắm rõ cách làm.\"},{\"id\":\"376\",\"type\":\"an-toan-suc-khoe-4\",\"group\":\"atsk_4_2\",\"obj\":[\"모르는 작업은 물어보기\",\"Hỏi về công việc không biết\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"물어보기가 무슨 뜻인가요?\",\"question_vi\":\"Bạn có biết 'hỏi' có nghĩa là gì không?\",\"answer_kr_hrd\":\"모르는 것이나 불확실한 사항에 대하여 정확한 정보를 얻기 위하여 다른 사람에게  질문하는  행위입니다.\",\"answer_kr\":\"물어보기는 모르는 것을 다른 사람에게 질문하는 것입니다.\",\"answer_vi_hrd\":\"Là hành động đặt câu hỏi cho người khác để có được thông tin chính xác về điều mình chưa biết hoặc chưa chắc chắn.\",\"answer_vi\":\"Hỏi là đặt câu hỏi cho người khác về điều mình chưa biết.\"},{\"id\":\"377\",\"type\":\"an-toan-suc-khoe-4\",\"group\":\"atsk_4_2\",\"obj\":[\"모르는 작업은 물어보기\",\"Hỏi về công việc không biết\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"모르는 작업은 왜 물어봐야 할까요?\",\"question_vi\":\"Bạn có biết tại sao cần phải hỏi về công việc không biết không?\",\"answer_kr_hrd\":\"작업  내용을  정확히  모르거나  확신이  없는  상태에서  작업하는  것은 자신과  동료의  생명과  안전까지  위협할  수  있기  때문입니다.\",\"answer_kr\":\"모르는 작업은 자신과 동료의 안전을 위해 반드시 물어봐야 합니다.\",\"answer_vi_hrd\":\"Vì làm việc khi không biết chính xác nội dung hoặc không chắc chắn có thể đe dọa đến tính mạng và sự an toàn của bản thân cũng như đồng nghiệp.\",\"answer_vi\":\"Cần hỏi khi không biết việc để bảo vệ an toàn cho mình và đồng nghiệp.\"},{\"id\":\"378\",\"type\":\"an-toan-suc-khoe-4\",\"group\":\"atsk_4_3\",\"obj\":[\"사고위험 발견 시 알려주기\",\"Thông báo khi phát hiện nguy cơ tai nạn\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"사고 위험이 무엇인가요?\",\"question_vi\":\"Bạn có biết 'nguy cơ tai nạn' có nghĩa là gì không?\",\"answer_kr_hrd\":\"작업 중 예상하지 못한 일로 작업자가 다치거나 재산상의 피해를 입을 수  있는  위험요인입니다.\",\"answer_kr\":\"사고 위험은 작업 중 다치거나 피해가 생길 수 있는 위험요인입니다.\",\"answer_vi_hrd\":\"Là yếu tố nguy hiểm có thể khiến người lao động bị thương hoặc gây thiệt hại về tài sản do sự việc ngoài dự kiến trong quá trình làm việc.\",\"answer_vi\":\"Nguy cơ tai nạn là yếu tố có thể gây thương tích hoặc thiệt hại khi làm việc.\"},{\"id\":\"379\",\"type\":\"an-toan-suc-khoe-4\",\"group\":\"atsk_4_3\",\"obj\":[\"사고위험 발견 시 알려주기\",\"Thông báo khi phát hiện nguy cơ tai nạn\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"발견이 무슨 뜻인가요?\",\"question_vi\":\"Bạn có biết 'phát hiện' có nghĩa là gì không?\",\"answer_kr_hrd\":\"숨겨져  있거나  보이지  않던  위험요인,  고장,  불량,  이상  상태  등을 알아차리거나  찾아내는  것입니다.\",\"answer_kr\":\"발견은 보이지 않던 위험이나 이상을 찾아내는 것입니다.\",\"answer_vi_hrd\":\"Là việc nhận ra hoặc tìm thấy các yếu tố nguy hiểm, hỏng hóc, lỗi hay trạng thái bất thường từng bị che khuất hoặc chưa được nhìn thấy.\",\"answer_vi\":\"Phát hiện là nhận ra hoặc tìm ra nguy hiểm, bất thường chưa thấy trước đó.\"},{\"id\":\"380\",\"type\":\"an-toan-suc-khoe-4\",\"group\":\"atsk_4_3\",\"obj\":[\"사고위험 발견 시 알려주기\",\"Thông báo khi phát hiện nguy cơ tai nạn\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"사고위험 발견 시 왜 알려줘야 할까요?\",\"question_vi\":\"Bạn có biết tại sao khi phát hiện nguy cơ tai nạn phải thông báo không?\",\"answer_kr_hrd\":\"사고위험을  발견하고도  알리지  않으면,  그  위험은  그대로  방치되어 작업자와  동료의  생명과  안전을  위협하기  때문입니다.\",\"answer_kr\":\"사고위험을 알려야 다른 사람의 사고를 막을 수 있기 때문입니다.\",\"answer_vi_hrd\":\"Vì nếu phát hiện nguy cơ tai nạn mà không thông báo, nguy cơ đó sẽ bị bỏ mặc và đe dọa tính mạng, sự an toàn của người lao động cùng đồng nghiệp.\",\"answer_vi\":\"Cần báo nguy cơ tai nạn để ngăn tai nạn cho người khác.\"},{\"id\":\"381\",\"type\":\"an-toan-suc-khoe-4\",\"group\":\"atsk_4_4\",\"obj\":[\"폭염 시 물, 그늘, 휴식\",\"Nước, bóng râm và nghỉ ngơi khi có nắng nóng\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\" 폭염이 무엇인가요?\",\"question_vi\":\"Bạn có biết 'nắng nóng' có nghĩa là gì không?\",\"answer_kr_hrd\":\"기온이  매우  높고  무더운  상태가  일정  기간  지속되는  현상으로 최고기온이  33도(℃)  이상인  날이  2일  이상  계속되는  경우입니다.\",\"answer_kr\":\"폭염은 최고기온이 33도 이상인 날이 2일 이상 계속되는 현상입니다.\",\"answer_vi_hrd\":\"Là hiện tượng nhiệt độ rất cao và thời tiết oi bức kéo dài trong một khoảng thời gian, cụ thể là nhiệt độ cao nhất từ 33°C trở lên liên tục ít nhất hai ngày.\",\"answer_vi\":\"Nắng nóng là hiện tượng nhiệt độ cao nhất từ 33 độ trở lên kéo dài trong 2 ngày trở lên.\"},{\"id\":\"382\",\"type\":\"an-toan-suc-khoe-4\",\"group\":\"atsk_4_4\",\"obj\":[\"폭염 시 물, 그늘, 휴식\",\"Nước, bóng râm và nghỉ ngơi khi có nắng nóng\"],\"level\":\"2\",\"timer\":\"\",\"question_kr\":\"폭염 시 왜 물, 그늘, 휴식을 해야 할까요?\",\"question_vi\":\"Bạn có biết tại sao khi có nắng nóng phải uống nước, nghỉ ngơi và tìm bóng râm không?\",\"answer_kr_hrd\":\"폭염  상태에서의  작업은  작업자의  체온  상승과  몸  속  수분 손실을  빠르게  하여  생명까지  위협받을  수  있기  때문입니다.\",\"answer_kr\":\"폭염 때는 체온 상승과 탈수를 막기 위해 물, 그늘, 휴식이 필요합니다.\",\"answer_vi_hrd\":\"Vì làm việc trong điều kiện nắng nóng khiến thân nhiệt người lao động tăng và cơ thể mất nước nhanh chóng, thậm chí có thể đe dọa tính mạng.\",\"answer_vi\":\"Khi nắng nóng cần nước, bóng râm và nghỉ ngơi để tránh tăng nhiệt và mất nước.\"},{\"id\":\"383\",\"type\":\"an-toan-suc-khoe-4\",\"group\":\"atsk_4_4\",\"obj\":[\"폭염 시 물, 그늘, 휴식\",\"Nước, bóng râm và nghỉ ngơi khi có nắng nóng\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"날씨가 너무 더우면 어떻게 해야 하나요?\",\"question_vi\":\"Bạn nên làm gì khi thời tiết quá nóng?\",\"answer_kr_hrd\":\"물을  자주  마시고  그늘에서  자주  휴식을  취합니다.\",\"answer_kr\":\"날씨가 너무 더우면 물을 자주 마시고 그늘에서 쉬어야 합니다.\",\"answer_vi_hrd\":\"Cần thường xuyên uống nước và nghỉ ngơi trong bóng râm.\",\"answer_vi\":\"Khi trời quá nóng cần uống nước thường xuyên và nghỉ trong bóng râm.\"},{\"id\":\"384\",\"type\":\"an-toan-suc-khoe-4\",\"group\":\"atsk_4_5\",\"obj\":[\"사고 위험 시 작업 중지 및 대피\",\"Dừng công việc và sơ tán khi có nguy cơ tai nạn\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"작업 중지가 무엇인가요?\",\"question_vi\":\"Bạn có biết 'dừng công việc' có nghĩa là gì không?\",\"answer_kr_hrd\":\"작업 도중 안전상 위험이 있다고 판단되거나 실제 사고가 발생할 우려가 있을  때,  즉시  작업을  멈추는  것입니다.\",\"answer_kr\":\"작업 중지는 위험할 때 즉시 일을 멈추는 것입니다.\",\"answer_vi_hrd\":\"Là việc dừng công việc ngay lập tức khi nhận thấy có nguy hiểm về an toàn trong lúc làm việc hoặc có khả năng xảy ra tai nạn thực tế.\",\"answer_vi\":\"Dừng công việc là ngừng làm ngay khi có nguy hiểm.\"},{\"id\":\"385\",\"type\":\"an-toan-suc-khoe-4\",\"group\":\"atsk_4_5\",\"obj\":[\"사고 위험 시 작업 중지 및 대피\",\"Dừng công việc và sơ tán khi có nguy cơ tai nạn\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"대피가 무슨 뜻인가요?\",\"question_vi\":\"Bạn có biết 'sơ tán' có nghĩa là gì không?\",\"answer_kr_hrd\":\"위험한  상황이  발생했을  때,  작업자의  생명과  신체를  보호하기  위해 안전한  장소로  신속히  이동하는  행위입니다.\",\"answer_kr\":\"대피는 위험한 상황에서 안전한 곳으로 빨리 이동하는 것입니다.\",\"answer_vi_hrd\":\"Là hành động nhanh chóng di chuyển đến nơi an toàn để bảo vệ tính mạng và cơ thể người lao động khi xảy ra tình huống nguy hiểm.\",\"answer_vi\":\"Sơ tán là nhanh chóng di chuyển đến nơi an toàn khi gặp nguy hiểm.\"},{\"id\":\"386\",\"type\":\"an-toan-suc-khoe-4\",\"group\":\"atsk_4_5\",\"obj\":[\"사고 위험 시 작업 중지 및 대피\",\"Dừng công việc và sơ tán khi có nguy cơ tai nạn\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"사고 위험 시 왜 작업을 중지하고 대피해야 할까요?\",\"question_vi\":\"Bạn có biết tại sao khi có nguy cơ tai nạn phải dừng công việc và sơ tán không?\",\"answer_kr_hrd\":\"작업을  멈추고  위험  상황에서  즉시  벗어나는  것은  기계, 설비보다  사람의  생명이  더  소중하기  때문입니다.\",\"answer_kr\":\"사람의 생명이 기계나 설비보다 중요하기 때문입니다.\",\"answer_vi_hrd\":\"Vì dừng công việc và lập tức rời khỏi tình huống nguy hiểm là cần thiết do tính mạng con người quý giá hơn máy móc, thiết bị.\",\"answer_vi\":\"Vì tính mạng con người quan trọng hơn máy móc và thiết bị.\"},{\"id\":\"387\",\"type\":\"an-toan-suc-khoe-4\",\"group\":\"atsk_4_5\",\"obj\":[\"사고 위험 시 작업 중지 및 대피\",\"Dừng công việc và sơ tán khi có nguy cơ tai nạn\"],\"level\":\"3\",\"timer\":\"\",\"question_kr\":\"사고의 위험이 있으면 어떻게 해야 하나요?\",\"question_vi\":\"Bạn nên làm gì khi có nguy cơ tai nạn?\",\"answer_kr_hrd\":\"사고 위험이 있으면 우선 작업을 중지하고 안전한 곳으로 대피해야 합니다.\",\"answer_kr\":\"사고 위험이 있으면 작업을 멈추고 안전한 곳으로 대피해야 합니다.\",\"answer_vi_hrd\":\"Nếu có nguy cơ xảy ra tai nạn, trước tiên phải dừng công việc và sơ tán đến nơi an toàn.\",\"answer_vi\":\"Nếu có nguy cơ tai nạn, cần dừng công việc và sơ tán đến nơi an toàn.\"}],\"bienchithi\":[{\"id\":1,\"question_kr\":\"반사조끼를 착용하시오\",\"question_vi\":\"Hãy mặc áo phản quang\"},{\"id\":2,\"question_kr\":\"머리 보호구를 착용하시오\",\"question_vi\":\"Hãy đeo bảo vệ đầu\"},{\"id\":3,\"question_kr\":\"보호장갑을 착용하시오\",\"question_vi\":\"Hãy đeo găng tay bảo hộ.\"},{\"id\":4,\"question_kr\":\"경적을 울리시오\",\"question_vi\":\"Hãy bấm còi\"},{\"id\":5,\"question_kr\":\"방호복을 착용하시오\",\"question_vi\":\"Hãy mặc trang phục bảo vệ\"},{\"id\":6,\"question_kr\":\"불투명 보안대를 반드시 착용하시오\",\"question_vi\":\"Hãy đeo kính an toàn mờ.\"},{\"id\":7,\"question_kr\":\"귀마개를 착용하시오\",\"question_vi\":\"Hãy đeo nút tai\"},{\"id\":8,\"question_kr\":\"보안경을착용하시오\",\"question_vi\":\"Hãy đeo kính bảo hộ\"},{\"id\":9,\"question_kr\":\"사용설명서,책자를 참조하십시오\",\"question_vi\":\"Hãy tham khảo sách hướng dẫn sử dụng\"},{\"id\":10,\"question_kr\":\"마스크를 착용하시오\",\"question_vi\":\"Hãy đeo khẩu trang\"},{\"id\":11,\"question_kr\":\"보호용 앞치마를 착용하시오\",\"question_vi\":\"Hãy mặc tạp dề bảo vệ.\"},{\"id\":12,\"question_kr\":\"손을 씻으시오\",\"question_vi\":\"Hãy rửa tay\"},{\"id\":13,\"question_kr\":\"손잡이를 사용하시오\",\"question_vi\":\"Hãy sử dụng tay cầm.\"},{\"id\":14,\"question_kr\":\"안전띠를 착용하시오\",\"question_vi\":\"Hãy cài dây an toàn.\"},{\"id\":15,\"question_kr\":\"얼굴 보호구를 착용하시오\",\"question_vi\":\"Hãy đeo bảo vệ mặt.\"},{\"id\":16,\
